<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Грондхейм: Истинная Капля (Гладкая)</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { position: absolute; }
        #hint { color: #333; font-family: sans-serif; letter-spacing: 2px; font-size: 10px; position: absolute; bottom: 20px; text-transform: uppercase; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="hint">Почувствуй гладкость Капли</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let audioContext, analyser, data;
    let started = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function init() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128; // Меньше деталей для более гладкой реакции
        analyser.smoothingTimeConstant = 0.8; 
        navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
            audioContext.createMediaStreamSource(s).connect(analyser);
            document.getElementById('hint').innerText = "Глубина...";
            loop();
        });
    }

    function loop() {
        requestAnimationFrame(loop);
        data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);

        // Мягкий шлейф для эффекта вязкости
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const x = canvas.width / 2;
        const y = canvas.height / 2;
        
        let sum = 0;
        for(let i=0; i<10; i++) sum += data[i]; // Реагируем только на басы
        let volume = sum / 10;

        // Базовый размер Капли и сила "волнения"
        let baseR = 150 + volume * 0.4; // База увеличена до 150
        let waveAmp = volume * 0.3; // Сила деформации
        
        ctx.beginPath();
        // Используем 12 контрольных точек для создания гладкого "жидкого" контура
        let numPoints = 12; // Увеличили количество точек для идеального сглаживания
        let time = Date.now() * 0.002;
        
        let points = [];
        for(let i = 0; i < numPoints; i++) {
            let angle = (i / numPoints) * Math.PI * 2;
            // Каждая точка "дышит" по-своему, создавая асимметрию
            let noise = data[i%data.length] * 0.1;
            let currentAmp = waveAmp + noise;
            let r = baseR + Math.sin(angle + time + i) * currentAmp;
            points.push({
                x: x + Math.cos(angle) * r,
                y: y + Math.sin(angle) * r
            });
        }
        
        // Рисуем гладкую форму через кривые Безье
        ctx.moveTo(points[0].x, points[0].y);
        for(let i = 0; i < numPoints; i++) {
            let p1 = points[i];
            let p2 = points[(i + 1) % numPoints];
            // Контрольная точка для сглаживания
            let cx = (p1.x + p2.x) / 2;
            let cy = (p1.y + p2.y) / 2;
            ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
        }
        ctx.closePath();

        // Свечение "ртути"
        let grd = ctx.createRadialGradient(x, y, 0, x, y, baseR * 1.3);
        grd.addColorStop(0, '#ffffff'); // Центр
        grd.addColorStop(0.2, '#b0c4de'); // Основной
        grd.addColorStop(0.5, '#4682b4'); // Глубина
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grd;
        ctx.fill();
        
        // Матовый блик для объема (как на ртутном шаре)
        ctx.beginPath();
        ctx.ellipse(x - 30, y - 30, baseR/3, baseR/4, Math.PI/4, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fill();
    }

    window.onclick = () => { if(!started) { started = true; init(); } };
</script>
</body>
</html>
