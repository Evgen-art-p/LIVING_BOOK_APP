<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Грондхейм — Кабинет Родителя</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--card:#12121e;--border:#1e1e30;--accent:#00c8ff;--gold:#ffcc44;--text:#c8c8d8;--dim:#667;--danger:#ff4444}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh}
.nav{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px}
.nav h1{font-size:16px;font-weight:600;color:var(--accent);letter-spacing:1px}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:auto}
.nav .dot.on{background:#44ff88}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:1;padding:12px 8px;background:0 0;border:none;color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;min-width:80px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;padding:20px;max-width:600px;margin:0 auto}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{font-size:14px;color:var(--accent);margin-bottom:10px;font-weight:500}
.card p{font-size:13px;line-height:1.7;color:var(--text)}
.card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.card .value{font-size:15px;color:var(--text);margin-bottom:12px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s;width:100%}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;letter-spacing:.5px}
.pill-ok{background:rgba(68,255,136,.1);color:#44ff88}
.basket-item{padding:12px;border-bottom:1px solid var(--border)}
.basket-item:last-child{border:none}
.basket-item .q{font-size:13px;color:var(--gold);margin-bottom:4px}
.basket-item .a{font-size:12px;color:var(--dim)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<nav class="nav">
  <h1>⬡ Грондхейм</h1>
  <span style="font-size:12px;color:var(--dim)">Кабинет Родителя</span>
  <div class="dot" id="server-dot"></div>
</nav>
<div class="tabs">
  <button class="on" data-tab="order">Заказать</button>
  <button data-tab="profile">Профиль</button>
  <button data-tab="basket">Корзинка</button>
  <button data-tab="bio">Биография</button>
  <button data-tab="status">Сервер</button>
</div>

<div class="panel on" id="p-order">
  <div class="card">
    <h3>Новая история для ребёнка</h3>
    <div class="label">Имя ребёнка</div>
    <input id="f-name" value="Женя">
    <div class="label">Возраст</div>
    <select id="f-age"><option value="3-6">3–6 лет</option><option value="7-12" selected>7–12 лет</option><option value="13+">13+ лет</option></select>
    <div class="label">О чём история? Что сейчас волнует ребёнка?</div>
    <textarea id="f-task" placeholder="Например: Женя скучает по другу, который переехал в другой город"></textarea>
    <button class="btn btn-primary" id="btn-gen" onclick="generate()">Создать историю</button>
  </div>
  <div id="gen-result"></div>
</div>

<div class="panel" id="p-profile"><div id="profile-c"><div class="spinner"></div></div></div>
<div class="panel" id="p-basket"><div id="basket-c"><div class="spinner"></div></div></div>
<div class="panel" id="p-bio"><div id="bio-c"><div class="spinner"></div></div></div>
<div class="panel" id="p-status"><div id="status-c"><div class="spinner"></div></div></div>

<script>
const SERVER='http://127.0.0.1:8001';
let CHILD='Женя';

// ТАБЫ
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('p-'+btn.dataset.tab).classList.add('on');
    if(btn.dataset.tab==='profile')loadProfile();
    if(btn.dataset.tab==='basket')loadBasket();
    if(btn.dataset.tab==='bio')loadBio();
    if(btn.dataset.tab==='status')loadStatus();
  };
});

// ЗАКАЗ
async function generate(){
  const name=document.getElementById('f-name').value.trim();
  const age=document.getElementById('f-age').value;
  const task=document.getElementById('f-task').value.trim();
  if(!name||!task){alert('Заполни имя и тему');return;}
  CHILD=name;
  const btn=document.getElementById('btn-gen');
  const res=document.getElementById('gen-result');
  btn.disabled=true;btn.textContent='Создаю…';
  res.innerHTML='<div class="card"><div class="spinner"></div><p style="text-align:center;margin-top:12px">18 агентов работают. Это займёт 2–5 минут.</p></div>';
  try{
    const r=await fetch(`${SERVER}/api/studio/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({child_name:name,child_age:age,task_context:task})});
    const d=await r.json();
    if(d.ok){
      res.innerHTML=`<div class="card"><h3>✅ История создана!</h3><p>Книга для <strong>${d.child_name}</strong> готова.</p><p style="margin-top:8px"><span class="pill pill-ok">${d.agents_completed} агентов отработали</span></p><p style="margin-top:12px">Откройте Искорку на устройстве ребёнка — история загрузится автоматически.</p></div>`;
    }else{res.innerHTML=`<div class="card"><h3>⚠️ Ошибка</h3><p>${JSON.stringify(d)}</p></div>`;}
  }catch(e){
    res.innerHTML=`<div class="card"><h3>❌ Маяк недоступен</h3><p>Запустите сервер: <code style="font-size:11px">cd server && uvicorn beacon_v4:app --port 8001</code></p></div>`;
  }
  btn.disabled=false;btn.textContent='Создать историю';
}

// ПРОФИЛЬ
async function loadProfile(){
  const el=document.getElementById('profile-c');
  try{
    const r=await fetch(`${SERVER}/api/parent/child_profile/${encodeURIComponent(CHILD)}`);
    if(!r.ok)throw 0;
    const d=await r.json();
    el.innerHTML=`
      <div class="card"><h3>Профиль: ${d.child_name||CHILD}</h3>
        <div class="label">Всего сессий</div><div class="value">${d.total_sessions||0}</div>
        <div class="label">Всего выборов</div><div class="value">${d.total_choices_made||0}</div></div>
      <div class="card"><h3>Психологические паттерны</h3>
        ${(d.psychological_patterns||[]).map(p=>`<p>• ${p}</p>`).join('')||'<p class="msg">Пока нет данных</p>'}</div>
      <div class="card"><h3>Зоны роста</h3>
        ${(d.growth_zones||[]).map(z=>`<p>• ${z}</p>`).join('')||'<p class="msg">Пока нет данных</p>'}</div>`;
  }catch(e){el.innerHTML=`<div class="msg">Профиль появится после первой истории для ${CHILD}.</div>`;}
}

// КОРЗИНКА
async function loadBasket(){
  const el=document.getElementById('basket-c');
  try{
    let d;
    try{const r=await fetch(`${SERVER}/api/beacon/stories/${encodeURIComponent(CHILD)}/basket`);if(r.ok){const j=await r.json();d=j.basket;}}catch(e){}
    if(!d){const r=await fetch(`${SERVER}/api/parent/gift_baskets/${encodeURIComponent(CHILD)}`);if(r.ok)d=await r.json();}
    if(!d)throw 0;
    el.innerHTML=`
      <div class="card"><h3>🎁 Корзинка Даров</h3>
        <div class="label">Тема</div><div class="value">${d.story_theme||d.task_context||'—'}</div>
        <div class="label">Дата</div><div class="value">${d.date?new Date(d.date).toLocaleDateString('ru'):'—'}</div></div>
      <div class="card"><h3>Инсайты для вас</h3>
        ${(d.parent_insights||[]).map(i=>`<p>• ${i}</p>`).join('')||'<p class="msg">Пока нет инсайтов</p>'}</div>
      <div class="card"><h3>Мостик в реальную жизнь</h3>
        <div class="label">Начните разговор с</div>
        ${(d.bridge_to_reality?.conversation_starters||[]).map(s=>`<div class="basket-item"><div class="q">💬 ${s}</div></div>`).join('')}
        <div class="label" style="margin-top:12px">Совместные активности</div>
        ${(d.bridge_to_reality?.activities||[]).map(a=>`<div class="basket-item"><div class="a">🎨 ${a}</div></div>`).join('')}</div>
      <div class="card"><h3>Следующая тема</h3><p>${d.next_story_hints?.suggested_theme||'Пока нет рекомендации'}</p></div>`;
  }catch(e){el.innerHTML=`<div class="msg">Корзинка появится после первой истории.</div>`;}
}

// БИОГРАФИЯ
async function loadBio(){
  const el=document.getElementById('bio-c');
  try{
    const r=await fetch(`${SERVER}/api/parent/biography/${encodeURIComponent(CHILD)}`);
    if(!r.ok)throw 0;
    const d=await r.json();
    el.innerHTML=`
      <div class="card"><h3>Биография: ${d.child_name||CHILD}</h3>
        <div class="label">Всего историй</div><div class="value">${d.total_stories||0}</div></div>
      <div class="card"><h3>Связи с персонажами</h3>
        ${Object.entries(d.character_bonds||{}).map(([k,v])=>`<p>${k}: <strong>${v} встреч</strong></p>`).join('')||'<p class="msg">Пока нет встреч</p>'}</div>
      <div class="card"><h3>Последние следы</h3>
        ${(d.karmic_trail||[]).slice(-5).reverse().map(t=>`<div class="basket-item"><div class="q">${t.theme||'—'} — ${t.emotional_goal||''}</div><div class="a">${new Date(t.date).toLocaleDateString('ru')} · ${(t.characters_met||[]).join(', ')||'—'}</div></div>`).join('')||'<p class="msg">Пока нет историй</p>'}</div>`;
  }catch(e){el.innerHTML=`<div class="msg">Биография появится после первой истории.</div>`;}
}

// СТАТУС
async function loadStatus(){
  const el=document.getElementById('status-c');
  try{
    const[health,stats]=await Promise.all([fetch(`${SERVER}/health`).then(r=>r.json()),fetch(`${SERVER}/stats`).then(r=>r.json())]);
    document.getElementById('server-dot').classList.add('on');
    el.innerHTML=`
      <div class="card"><h3>Маяк</h3>
        <div class="label">Статус</div><div class="value"><span class="pill pill-ok">${health.status}</span> v${health.version}</div>
        <div class="label">Модель</div><div class="value">${health.model}</div>
        <div class="label">API ключ</div><div class="value">${health.api_key_set?'✅ Установлен':'❌ Нет'}</div>
        <div class="label">Агентов</div><div class="value">${health.agents_available}</div></div>
      <div class="card"><h3>Статистика</h3>
        <div class="label">Устройств</div><div class="value">${stats.total_devices}</div>
        <div class="label">Синхронизаций</div><div class="value">${stats.total_syncs}</div>
        <div class="label">Книг создано</div><div class="value">${stats.total_generated_books}</div></div>`;
  }catch(e){
    document.getElementById('server-dot').classList.remove('on');
    el.innerHTML=`<div class="msg">Маяк недоступен.<br><br><code style="font-size:11px;color:var(--dim)">cd server && uvicorn beacon_v4:app --port 8001</code></div>`;
  }
}

// АВТОПРОВЕРКА
fetch(`${SERVER}/health`).then(()=>document.getElementById('server-dot').classList.add('on')).catch(()=>{});
</script>
</body>
</html>
