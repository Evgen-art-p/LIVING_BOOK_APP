<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alive Book — Грондхейм</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0c; color: #e0e0e0;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem;
        }
        .container { max-width: 480px; width: 100%; text-align: center; }
        .logo { font-size: 10px; letter-spacing: 0.3em; color: #7F77DD; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; }
        .title { font-size: 1.3rem; font-weight: 300; color: white; font-style: italic; margin-bottom: 2rem; }
        .title span { color: #22d3ee; font-style: normal; }
        .orb { width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 50%; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); display: flex; align-items: center; justify-content: center; animation: pulse 3s ease-in-out infinite; }
        .orb-inner { width: 30px; height: 30px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 20px rgba(34,211,238,0.6); }
        .orb.thinking .orb-inner { animation: think 0.8s ease-in-out infinite alternate; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.05);opacity:1} }
        @keyframes think { 0%{transform:scale(1);box-shadow:0 0 20px rgba(34,211,238,.6)} 100%{transform:scale(1.3);box-shadow:0 0 40px rgba(34,211,238,1)} }
        .speaker { font-size: 12px; color: #22d3ee; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 1rem; }
        .scene-text { font-size: 1.1rem; line-height: 1.8; color: #d0d0d0; margin-bottom: 2rem; min-height: 60px; }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { background: transparent; border: 1px solid rgba(6,182,212,0.4); color: #22d3ee; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
        .choice-btn:hover { background: rgba(6,182,212,0.1); border-color: #22d3ee; }
        .choice-btn:active { transform: scale(0.97); }
        .chat-area { display: none; flex-direction: column; gap: 12px; }
        .chat-area.active { display: flex; }
        .chat-history { max-height: 200px; overflow-y: auto; text-align: left; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .chat-history .child-msg { color: #9FE1CB; margin-bottom: 8px; }
        .chat-history .child-msg::before { content: "Ты: "; font-weight: 600; }
        .chat-history .char-msg { color: #d0d0d0; margin-bottom: 8px; }
        .turns-left { font-size: 10px; color: rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 0.1em; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row textarea { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; font-size: 14px; resize: none; min-height: 48px; font-family: inherit; }
        .chat-input-row textarea:focus { outline: none; border-color: #22d3ee; }
        .send-btn { background: transparent; border: 1px solid #22d3ee; color: #22d3ee; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .memory-bar { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); font-size: 10px; color: rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 0.1em; }
        .end-screen { display: none; text-align: center; }
        .end-screen.active { display: block; }
        .end-screen h2 { color: #22d3ee; font-weight: 300; margin-bottom: 1rem; }
        .end-screen .memories { color: #7F77DD; font-size: 13px; line-height: 2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Studio Six Fingers</div>
        <div class="title">Alive Book: <span>Грондхейм</span></div>
        <div class="orb" id="orb"><div class="orb-inner"></div></div>
        <div id="game-screen">
            <div class="speaker" id="speaker"></div>
            <div class="scene-text" id="scene-text">Загрузка...</div>
            <div class="choices" id="choices"></div>
            <div class="chat-area" id="chat-area">
                <div class="chat-history" id="chat-history"></div>
                <div class="turns-left" id="turns-left"></div>
                <div class="chat-input-row">
                    <textarea id="user-input" placeholder="Скажи что-нибудь..." rows="1"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendChat()">Ответить</button>
                </div>
            </div>
        </div>
        <div class="end-screen" id="end-screen">
            <h2>Первый день в Грондхейме завершён</h2>
            <p style="color:#888;margin-bottom:1.5rem;">Твои выборы запомнены. Когда вернёшься — мир будет помнить тебя.</p>
            <div class="memories" id="memory-display"></div>
        </div>
        <div class="memory-bar" id="memory-bar"></div>
    </div>
    <script>
        const API = 'http://localhost:8000';
        let currentScene = null;

        async function loadScene() {
            try {
                const res = await fetch(`${API}/scene`);
                currentScene = await res.json();
                renderScene(currentScene);
            } catch (e) {
                document.getElementById('scene-text').textContent =
                    'Не удалось подключиться. Запусти: cd server && uvicorn main:app --reload';
            }
        }

        function renderScene(scene) {
            currentScene = scene;
            const gameScreen = document.getElementById('game-screen');
            const endScreen = document.getElementById('end-screen');
            if (scene.after_speech === 'end') {
                gameScreen.style.display = 'none';
                endScreen.classList.add('active');
                loadMemories();
                return;
            }
            gameScreen.style.display = 'block';
            endScreen.classList.remove('active');
            document.getElementById('speaker').textContent = scene.character ? scene.character.name : (scene.speaker || '');
            document.getElementById('scene-text').textContent = scene.text || scene.context || '';
            const choicesEl = document.getElementById('choices');
            const chatArea = document.getElementById('chat-area');
            choicesEl.innerHTML = '';
            chatArea.classList.remove('active');
            document.getElementById('chat-history').innerHTML = '';
            if (scene.after_speech === 'ask_choice' && scene.choices) {
                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.label;
                    btn.onclick = () => makeChoice(choice.id);
                    choicesEl.appendChild(btn);
                });
            } else if (scene.mode === 'free_talk') {
                chatArea.classList.add('active');
                document.getElementById('turns-left').textContent = `Реплик осталось: ${scene.max_turns || '?'}`;
                document.getElementById('user-input').value = '';
                document.getElementById('user-input').focus();
            }
        }

        async function makeChoice(choiceId) {
            document.body.classList.add('loading');
            try {
                const res = await fetch(`${API}/choice`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({choice_id: choiceId}) });
                renderScene(await res.json());
                updateMemoryBar();
            } catch (e) { console.error('Ошибка:', e); }
            document.body.classList.remove('loading');
        }

        async function sendChat() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            input.value = '';
            addChatMessage('child', text);
            document.getElementById('orb').classList.add('thinking');
            try {
                const res = await fetch(`${API}/chat`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: text}) });
                const data = await res.json();
                addChatMessage('character', data.text, data.speaker);
                document.getElementById('turns-left').textContent = `Реплик осталось: ${data.turns_left}`;
                if (data.is_finished && data.next_scene) {
                    setTimeout(() => renderScene(data.next_scene), 2000);
                }
            } catch (e) {
                addChatMessage('character', '(Не удалось получить ответ...)', '');
            }
            document.getElementById('orb').classList.remove('thinking');
            sendBtn.disabled = false;
            input.focus();
        }

        function addChatMessage(role, text, speakerName) {
            const history = document.getElementById('chat-history');
            const div = document.createElement('div');
            if (role === 'child') { div.className = 'child-msg'; div.textContent = text; }
            else { div.className = 'char-msg'; div.innerHTML = `<span style="color:#22d3ee;font-weight:600">${speakerName||currentScene?.character?.name||''}:</span> ${text}`; }
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });

        async function updateMemoryBar() {
            try { const s = (await (await fetch(`${API}/state`)).json()); const bar = document.getElementById('memory-bar'); if (s.memory?.length) bar.textContent = 'память: ' + s.memory.map(m=>m.replace('memory:','')).join(' · '); } catch(e){}
        }
        async function loadMemories() {
            try { const s = (await (await fetch(`${API}/state`)).json()); const d = document.getElementById('memory-display'); if (s.memory?.length) d.textContent = 'Запомнено: ' + s.memory.map(m=>m.replace('memory:','').replace('artifact:','')).join(', '); } catch(e){}
        }

        loadScene();
    </script>
</body>
</html>
