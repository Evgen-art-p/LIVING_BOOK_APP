<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Book — Грондхейм</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0c;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 480px; width: 100%; text-align: center; }
        .logo {
            font-size: 10px; letter-spacing: 0.3em; color: #7F77DD;
            text-transform: uppercase; font-weight: 800; margin-bottom: 8px;
        }
        .title {
            font-size: 1.3rem; font-weight: 300; color: white;
            font-style: italic; margin-bottom: 2rem;
        }
        .title span { color: #22d3ee; font-style: normal; }

        .orb {
            width: 80px; height: 80px; margin: 0 auto 1.5rem;
            border-radius: 50%; background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 3s ease-in-out infinite;
        }
        .orb-inner {
            width: 30px; height: 30px; border-radius: 50%;
            background: #22d3ee; box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .speaker {
            font-size: 12px; color: #22d3ee; text-transform: uppercase;
            letter-spacing: 0.15em; font-weight: 600; margin-bottom: 1rem;
        }
        .scene-text {
            font-size: 1.1rem; line-height: 1.8; color: #d0d0d0;
            margin-bottom: 2rem; min-height: 60px;
        }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn {
            background: transparent; border: 1px solid rgba(6, 182, 212, 0.4);
            color: #22d3ee; padding: 14px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .choice-btn:hover { background: rgba(6, 182, 212, 0.1); border-color: #22d3ee; }
        .choice-btn:active { transform: scale(0.97); }

        .free-talk { display: none; flex-direction: column; gap: 12px; }
        .free-talk.active { display: flex; }
        .free-talk textarea {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 12px; border-radius: 12px;
            font-size: 14px; resize: none; min-height: 80px; font-family: inherit;
        }
        .free-talk textarea:focus { outline: none; border-color: #22d3ee; }
        .send-btn {
            background: transparent; border: 1px solid #22d3ee; color: #22d3ee;
            padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .loading { opacity: 0.5; pointer-events: none; }

        .memory-bar {
            margin-top: 2rem; padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 10px; color: rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 0.1em;
        }

        .end-screen { display: none; text-align: center; }
        .end-screen.active { display: block; }
        .end-screen h2 { color: #22d3ee; font-weight: 300; margin-bottom: 1rem; }
        .end-screen .memories { color: #7F77DD; font-size: 13px; line-height: 2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Studio Six Fingers</div>
        <div class="title">Living Book: <span>Грондхейм</span></div>
        <div class="orb"><div class="orb-inner"></div></div>

        <div id="game-screen">
            <div class="speaker" id="speaker"></div>
            <div class="scene-text" id="scene-text">Загрузка...</div>
            <div class="choices" id="choices"></div>
            <div class="free-talk" id="free-talk">
                <textarea id="user-input" placeholder="Скажи что-нибудь..."></textarea>
                <button class="send-btn" onclick="sendMessage()">Ответить</button>
            </div>
        </div>

        <div class="end-screen" id="end-screen">
            <h2>Первый день в Грондхейме завершён</h2>
            <p style="color: #888; margin-bottom: 1.5rem;">Твои выборы запомнены. Когда вернёшься — мир будет помнить тебя.</p>
            <div class="memories" id="memory-display"></div>
        </div>

        <div class="memory-bar" id="memory-bar"></div>
    </div>

    <script>
        const API = 'http://localhost:8000';

        async function loadScene() {
            try {
                const res = await fetch(`${API}/scene`);
                const scene = await res.json();
                renderScene(scene);
            } catch (e) {
                document.getElementById('scene-text').textContent =
                    'Не удалось подключиться к серверу. Запусти: uvicorn main:app --reload';
            }
        }

        function renderScene(scene) {
            const gameScreen = document.getElementById('game-screen');
            const endScreen = document.getElementById('end-screen');

            // Если конец
            if (scene.after_speech === 'end') {
                gameScreen.style.display = 'none';
                endScreen.classList.add('active');
                document.getElementById('scene-text').textContent = scene.text;
                loadMemories();
                return;
            }

            gameScreen.style.display = 'block';
            endScreen.classList.remove('active');

            // Имя персонажа
            const speaker = document.getElementById('speaker');
            if (scene.character) {
                speaker.textContent = scene.character.name;
            } else {
                speaker.textContent = scene.speaker || '';
            }

            // Текст сцены
            document.getElementById('scene-text').textContent =
                scene.text || scene.context || '';

            // Режим: кнопки или свободный ввод
            const choicesEl = document.getElementById('choices');
            const freeTalkEl = document.getElementById('free-talk');
            choicesEl.innerHTML = '';
            freeTalkEl.classList.remove('active');

            if (scene.after_speech === 'ask_choice' && scene.choices) {
                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.label;
                    btn.onclick = () => makeChoice(choice.id);
                    choicesEl.appendChild(btn);
                });
            } else if (scene.mode === 'free_talk') {
                freeTalkEl.classList.add('active');
                document.getElementById('user-input').value = '';
                document.getElementById('user-input').focus();
            }
        }

        async function makeChoice(choiceId) {
            document.body.classList.add('loading');
            try {
                const res = await fetch(`${API}/choice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ choice_id: choiceId })
                });
                const scene = await res.json();
                renderScene(scene);
                updateMemoryBar();
            } catch (e) {
                console.error('Ошибка выбора:', e);
            }
            document.body.classList.remove('loading');
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            // TODO: Фаза 2 — отправка в Gemini через /chat эндпоинт
            console.log('Сообщение ребёнка:', text);
            input.value = '';
            document.getElementById('scene-text').textContent =
                '(Скоро здесь будет живой ответ персонажа...)';
        }

        async function updateMemoryBar() {
            try {
                const res = await fetch(`${API}/state`);
                const state = await res.json();
                const bar = document.getElementById('memory-bar');
                if (state.memory && state.memory.length > 0) {
                    const tags = state.memory.map(m => m.replace('memory:', '')).join(' · ');
                    bar.textContent = 'память: ' + tags;
                }
            } catch (e) {}
        }

        async function loadMemories() {
            try {
                const res = await fetch(`${API}/state`);
                const state = await res.json();
                const display = document.getElementById('memory-display');
                if (state.memory && state.memory.length > 0) {
                    const items = state.memory.map(m => {
                        const tag = m.replace('memory:', '').replace('artifact:', '');
                        return tag;
                    });
                    display.textContent = 'Запомнено: ' + items.join(', ');
                }
            } catch (e) {}
        }

        loadScene();
    </script>
</body>
</html>
