<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Искорка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:absolute;top:0;left:0;touch-action:none}
#status{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:#334;font-size:11px;letter-spacing:3px;text-transform:uppercase;pointer-events:none;transition:color .6s;white-space:nowrap}
#caption{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:rgba(0,200,255,.4);font-size:14px;max-width:80vw;text-align:center;pointer-events:none;transition:opacity .8s;opacity:0;line-height:1.6}
#emergency{display:none;position:absolute;inset:0;background:rgba(0,0,0,.94);flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
#emergency.on{display:flex}
#emergency p{color:rgba(255,200,200,.9);font-size:15px;max-width:72vw;text-align:center;line-height:1.8}
#emergency button{background:0 0;border:1px solid rgba(255,200,200,.3);color:rgba(255,200,200,.6);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:10px 24px;cursor:pointer}
#start{position:absolute;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:50}
#start button{background:0 0;border:1px solid rgba(0,200,255,.3);color:rgba(0,200,255,.6);font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:14px 32px;cursor:pointer;transition:all .4s;border-radius:24px}
#start button:hover{border-color:rgba(0,200,255,.8);color:rgba(0,200,255,.9)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caption"></div>
<div id="status">—</div>
<div id="emergency"><p id="em-text"></p><button id="em-btn">Взрослый рядом — продолжить</button></div>
<div id="start"><button id="go">Зажечь Искорку</button></div>

<script>
// ══════════════════════════════════════════════════
// КОНФИГ
// ══════════════════════════════════════════════════
const SERVER = 'http://127.0.0.1:8001';
const CHILD  = 'Женя';
const SID    = 'session_' + Date.now().toString(36);
let autoListen = false;

// ══════════════════════════════════════════════════
// ПАМЯТЬ (IndexedDB)
// ══════════════════════════════════════════════════
const Mem = (() => {
  let db;
  const open = () => new Promise((ok, no) => {
    const r = indexedDB.open('iskra_fort', 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      ['progress','utterances','choices','tags','biography','sync_queue']
        .forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, s==='progress'||s==='biography'?{keyPath:'key'}:{autoIncrement:true}); });
    };
    r.onsuccess = e => { db = e.target.result; ok(); };
    r.onerror = () => no(r.error);
  });
  const tx = (s,m='readonly') => db.transaction(s,m).objectStore(s);
  const put = (s,d) => new Promise((ok,no) => { const r=tx(s,'readwrite').put(d); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); });
  const get = (s,k) => new Promise((ok,no) => { const r=tx(s).get(k); r.onsuccess=()=>ok(r.result||null); r.onerror=()=>no(r.error); });
  return {
    open,
    getProgress: sid => get('progress', sid),
    setProgress: (sid,ch,sc,t=0) => put('progress', {key:sid,ch,sc,t}),
    saveSay: (sid,text) => put('utterances', {sid,text,ts:Date.now()}),
    saveChoice: (sid,cid) => put('choices', {sid,choice_id:cid,ts:Date.now()}),
    addTag: (sid,tag) => put('tags', {sid,tag,ts:Date.now()}),
    setBio: (k,v) => put('biography', {key:k,value:v}),
    getBio: k => get('biography',k).then(r=>r?r.value:null),
  };
})();

// ══════════════════════════════════════════════════
// КНИГА (через /full или /meta+/chapters)
// ══════════════════════════════════════════════════
const Book = (() => {
  let book = null, chapters = {};

  async function init() {
    // Пробуем /full (PROTOCOL §8 вопрос 1)
    try {
      const r = await fetch(`${SERVER}/api/beacon/stories/${encodeURIComponent(CHILD)}/full`, {signal: AbortSignal.timeout(5000)});
      if (r.ok) {
        const d = await r.json();
        if (d.status === 'ok' && d.book) {
          book = d.book;
          if (d.first_chapter) { indexChapter(d.first_chapter); chapters[d.first_chapter.id] = d.first_chapter; }
          console.log('[Book] /full OK:', book.title);
          return;
        }
      }
    } catch(e) { console.warn('[Book] /full failed, trying /meta...'); }

    // Fallback: /meta + /chapters
    try {
      const r = await fetch(`${SERVER}/api/beacon/stories/${encodeURIComponent(CHILD)}/meta`, {signal: AbortSignal.timeout(5000)});
      if (!r.ok) throw new Error(r.status);
      book = await r.json();
      const ch = book.starting_chapter || 'ch01';
      await loadChapter(ch);
      console.log('[Book] meta+chapter OK:', book.title);
    } catch(e) { throw new Error('Маяк недоступен'); }
  }

  async function loadChapter(id) {
    if (chapters[id]) return chapters[id];
    const r = await fetch(`${SERVER}/api/beacon/stories/${encodeURIComponent(CHILD)}/chapters/${encodeURIComponent(id)}`);
    if (!r.ok) return null;
    const d = await r.json();
    indexChapter(d);
    chapters[id] = d;
    return d;
  }

  function indexChapter(ch) {
    if (!ch || !ch.scenes) return;
    ch._idx = {};
    ch.scenes.forEach(s => { const id = s.scene_id || s.id; if(id) { ch._idx[id]=s; s.scene_id=id; } });
  }

  function getScene(chId, scId) { return chapters[chId]?._idx?.[scId] || null; }
  async function findScene(scId) {
    for (const m of (book?.chapters||[])) {
      const ch = await loadChapter(m.id);
      if (ch?._idx?.[scId]) return {chId:m.id, scene:ch._idx[scId]};
    }
    return null;
  }
  function start() { return {chId: book?.starting_chapter||'ch01', scId: book?.starting_scene||'scene_01'}; }
  function intents() { return book?.global_intents || {}; }
  function firstScene(chId) { return chapters[chId]?.scenes?.[0] || null; }
  function title() { return book?.title || 'Грондхейм'; }

  return {init,getScene,findScene,start,intents,firstScene,title,loadChapter};
})();

// ══════════════════════════════════════════════════
// CANVAS — Искорка-орб
// ══════════════════════════════════════════════════
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let clr = {r:0,g:200,b:255}, state = 'idle', tick=0;
let audioCtx, analyser, micData;

function setColor(n) {
  const MAP = {cyan:'#00c8ff',gold:'#ffcc44',blue:'#4488ff',red:'#ff4444',green:'#44ff88',orange:'#ff8844',white:'#ffffff'};
  const h = MAP[n?.toLowerCase()] || n || '#00c8ff';
  const m = h.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if(m) clr={r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)};
}
function rgba(a){return `rgba(${clr.r},${clr.g},${clr.b},${a})`;}
function resize(){cv.width=innerWidth;cv.height=innerHeight;} resize(); addEventListener('resize',resize);

function draw() {
  requestAnimationFrame(draw);
  const w=cv.width, h=cv.height, mx=w/2, my=h/2;
  cx.fillStyle='rgba(0,0,0,.16)'; cx.fillRect(0,0,w,h);
  tick += state==='thinking'?.055:.035;
  let vol = state==='idle' ? 3+Math.sin(tick)*2 : state==='thinking' ? 6+Math.sin(tick*2)*3 : getVol();
  const r = 5+vol*1.8;
  const g1=cx.createRadialGradient(mx,my,0,mx,my,r*5);
  g1.addColorStop(0,rgba(.22));g1.addColorStop(.5,rgba(.04));g1.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g1;cx.beginPath();cx.arc(mx,my,r*5,0,Math.PI*2);cx.fill();
  const g2=cx.createRadialGradient(mx,my,0,mx,my,r*2.5);
  g2.addColorStop(0,rgba(.95));g2.addColorStop(.3,rgba(.3));g2.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g2;cx.beginPath();cx.arc(mx,my,r*2.5,0,Math.PI*2);cx.fill();
  if(micData&&(state==='listening'||state==='speaking')){
    analyser.getByteFrequencyData(micData);
    cx.beginPath();
    for(let i=0;i<micData.length;i+=4){const a=(i/micData.length)*Math.PI*2,d=micData[i]*1.4;cx.moveTo(mx+Math.cos(a)*r,my+Math.sin(a)*r);cx.lineTo(mx+Math.cos(a)*(r+d),my+Math.sin(a)*(r+d));}
    cx.strokeStyle=rgba(.3);cx.lineWidth=1;cx.stroke();
  }
  if(state==='thinking'){for(let i=0;i<12;i++){const a=tick+(i/12)*Math.PI*2,d=28+Math.sin(tick*3+i)*14;cx.beginPath();cx.moveTo(mx+Math.cos(a)*r,my+Math.sin(a)*r);cx.lineTo(mx+Math.cos(a)*(r+d),my+Math.sin(a)*(r+d));cx.strokeStyle=rgba(.2);cx.lineWidth=.8;cx.stroke();}}
}
function getVol(){if(!analyser||!micData)return 0;analyser.getByteFrequencyData(micData);let s=0;for(let i=0;i<128;i++)s+=micData[i];return s/128;}
draw();

const LABELS={idle:'Коснись, чтобы говорить',listening:'Слушаю…',thinking:'Думаю…',speaking:'Говорю…'};
function setState(s){state=s;document.getElementById('status').textContent=LABELS[s]||'';}
function showCap(t){const e=document.getElementById('caption');e.textContent=t;e.style.opacity='1';}
function hideCap(){document.getElementById('caption').style.opacity='0';}

// ══════════════════════════════════════════════════
// TTS + STT
// ══════════════════════════════════════════════════
let synthVoice=null, stt=null;
function initTTS(){const l=()=>{synthVoice=speechSynthesis.getVoices().find(v=>v.lang==='ru-RU')||null;};speechSynthesis.onvoiceschanged=l;l();}
function initSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return;
  stt=new SR(); stt.lang='ru-RU'; stt.continuous=false; stt.interimResults=false;
  stt.onresult=e=>onSpoke(e.results[0][0].transcript.trim());
  stt.onerror=e=>{if(e.error!=='no-speech')setState('idle');};
  stt.onend=()=>{if(state==='listening')setState('idle');};
}
function listen(){if(!stt||state!=='idle')return;try{stt.start();setState('listening');}catch(e){}}

function speak(text,color,onDone){
  if(!text){if(onDone)onDone();return;}
  if(color)setColor(color);
  setState('speaking'); showCap(text);
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ru-RU';u.rate=.88;u.pitch=1.05;
  if(synthVoice)u.voice=synthVoice;
  u.onend=u.onerror=()=>{hideCap();if(onDone)onDone();else if(autoListen)setTimeout(listen,400);else setState('idle');};
  speechSynthesis.speak(u);
}

// ══════════════════════════════════════════════════
// НАВИГАЦИЯ
// ══════════════════════════════════════════════════
let curScene=null, curCh=null;

async function playScene(scene){
  if(!scene){setState('idle');return;}
  curScene=scene;
  const intro=scene.intro_event;
  if(!intro||!intro.text){setState('idle');return;}
  setColor(intro.ui_pulse_color||'cyan');
  speak(intro.text, null, ()=>{
    if(scene.mode==='ask_choice'){
      showCap((scene.choices||[]).map(c=>c.label).join(' · '));
      if(autoListen)setTimeout(listen,400);else setState('idle');
    } else {
      if(autoListen)setTimeout(listen,400);else setState('idle');
    }
  });
}

async function goScene(scId){
  if(scId==='end'){speak('Спасибо, что был со мной. До встречи в Грондхейме.','gold');return;}
  const found=await Book.findScene(scId);
  if(found){curCh=found.chId;curScene=found.scene;await Mem.setProgress(SID,found.chId,scId);playScene(found.scene);}
  else speak('Хм, тропинка пропала… Но я рядом.','cyan');
}

// ══════════════════════════════════════════════════
// ОБРАБОТКА РЕЧИ
// ══════════════════════════════════════════════════
async function onSpoke(text){
  if(!text)return;
  setState('thinking');
  await Mem.saveSay(SID,text);

  // 1. Global intents (emergency)
  const gi=Book.intents();
  for(const[name,intent] of Object.entries(gi)){
    if(intent.keywords.some(k=>text.toLowerCase().includes(k))){
      if(intent.action==='pause_game_until_adult'){setColor('red');setState('speaking');document.getElementById('em-text').textContent=intent.reply_text;document.getElementById('emergency').classList.add('on');speak(intent.reply_text,'red');await Mem.addTag(SID,'emergency');return;}
      speak(intent.reply_text,intent.ui_pulse_color||'red');return;
    }
  }

  const scene=curScene;
  if(!scene){speak(`Расскажи мне, ${CHILD}.`,'cyan');return;}

  // 2. ask_choice — ищем match
  if(scene.mode==='ask_choice'){
    const t=text.toLowerCase();
    const ch=(scene.choices||[]).find(c=>(c.keywords||[]).some(k=>t.includes(k)));
    if(ch){await Mem.saveChoice(SID,ch.id);await Mem.addTag(SID,ch.memory_vector||ch.id);speak('Хорошо!',null,()=>goScene(ch.next_scene));return;}
    const fb=scene.scripted_responses?.fallback;
    speak(fb?.reply_text||`Скажи: ${(scene.choices||[]).map(c=>c.label).join(' или ')}?`, fb?.ui_pulse_color||'cyan');
    return;
  }

  // 3. free_talk — scripted_responses
  const sr=scene.scripted_responses||{};
  const t=text.toLowerCase();
  let matched=null;
  for(const[key,resp] of Object.entries(sr)){
    if(key==='fallback')continue;
    if(resp.keywords&&resp.keywords.some(k=>t.includes(k.toLowerCase()))){matched=resp;break;}
  }

  if(matched){
    if(matched.memory_vector)await Mem.addTag(SID,matched.memory_vector);
    if(matched.memory_key)await Mem.setBio(matched.memory_key,text.slice(0,100));
    speak(matched.reply_text,matched.ui_pulse_color||'cyan');
    const p=await Mem.getProgress(SID);
    const turns=(p?.t||0)+1;
    await Mem.setProgress(SID,curCh,scene.scene_id,turns);
    if(turns>=scene.max_turns)setTimeout(()=>goScene(scene.on_end||'end'),1500);
    return;
  }

  // 4. LLM fallback через Маяк
  try{
    const r=await fetch(`${SERVER}/api/free_talk`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({child_text:text,scene_id:scene.scene_id||'unknown',chapter_id:curCh||'',child_name:CHILD,session_id:SID}),signal:AbortSignal.timeout(5000)});
    const d=await r.json();
    if(d.text&&!d.blocked){speak(d.text,d.color||'cyan');const p=await Mem.getProgress(SID);const turns=(p?.t||0)+1;await Mem.setProgress(SID,curCh,scene.scene_id,turns);if(turns>=scene.max_turns)setTimeout(()=>goScene(scene.on_end||'end'),1500);return;}
  }catch(e){console.warn('[LLM] offline');}

  // 5. Финальный fallback
  const fb=sr.fallback;
  speak(fb?.reply_text||'Я тебя слышу. Расскажи ещё.', fb?.ui_pulse_color||'cyan');
}

// ══════════════════════════════════════════════════
// ЗАПУСК
// ══════════════════════════════════════════════════
async function boot(){
  document.getElementById('start').style.display='none';
  setState('thinking');
  await Mem.open();

  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    micData=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){console.warn('[Mic]',e);}

  initSTT();initTTS();

  try{
    await Book.init();
    const s=Book.start();
    curCh=s.chId;
    curScene=Book.getScene(s.chId,s.scId)||Book.firstScene(s.chId);
    speak(`Привет, ${CHILD}. Добро пожаловать.`,'cyan',()=>playScene(curScene));
  }catch(e){
    console.warn('[Boot]',e);
    // §6.1: если нет книги — Искорка просто здоровается
    speak(`Привет, ${CHILD}! Я Искорка. Я пока готовлю для тебя историю. Но мы уже можем поболтать!`,'cyan',()=>setState('idle'));
  }
}

document.getElementById('go').onclick=()=>{autoListen=true;boot();};
document.getElementById('em-btn').onclick=()=>{document.getElementById('emergency').classList.remove('on');setColor('cyan');setState('idle');speak('Хорошо, взрослый рядом. Продолжим?','cyan');};
cv.addEventListener('click',()=>{if(state==='idle')listen();});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(state==='idle')listen();},{passive:false});

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
