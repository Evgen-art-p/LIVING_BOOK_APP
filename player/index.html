<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Искорка — Живая Книга v6.0 (STANDARD v3.0)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:absolute;top:0;left:0;touch-action:none;opacity:0.2;pointer-events:none}
#status{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:#334;font-size:11px;letter-spacing:3px;text-transform:uppercase;pointer-events:none;white-space:nowrap}
#caption{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:rgba(0,200,255,.4);font-size:14px;max-width:80vw;text-align:center;pointer-events:none;transition:opacity .8s;opacity:0;line-height:1.6}
#emergency{display:none;position:absolute;inset:0;background:rgba(0,0,0,.94);flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
#emergency.on{display:flex}
#emergency p{color:rgba(255,200,200,.9);font-size:15px;max-width:72vw;text-align:center;line-height:1.8}
#emergency button{background:0 0;border:1px solid rgba(255,200,200,.3);color:rgba(255,200,200,.6);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:10px 24px;cursor:pointer}
#bridge-panel{display:none;position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);backdrop-filter:blur(10px);border-radius:24px;padding:12px 20px;border:1px solid rgba(255,200,100,.3);max-width:85vw;text-align:center;z-index:60}
#bridge-panel.show{display:block}
#bridge-text{color:#ffcc66;font-size:13px;margin-bottom:8px}
#bridge-complete{background:0 0;border:1px solid #ffcc66;color:#ffcc66;border-radius:20px;padding:6px 16px;font-size:11px;cursor:pointer}
#start{position:absolute;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:50}
#start button{background:0 0;border:1px solid rgba(0,200,255,.3);color:rgba(0,200,255,.6);font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:14px 32px;cursor:pointer;transition:all .4s;border-radius:24px}
#start button:hover{border-color:rgba(0,200,255,.8);color:rgba(0,200,255,.9)}
#audio-indicator{position:absolute;top:20px;right:20px;width:12px;height:12px;border-radius:50%;background:#00c8ff;opacity:0;transition:opacity .2s;z-index:50}
#audio-indicator.active{opacity:1;animation:pulse-audio 1s ease-in-out infinite}
@keyframes pulse-audio{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="audio-indicator"></div>
<div id="bridge-panel"><div id="bridge-text"></div><button id="bridge-complete">✅ Выполнил(а) с родителем</button></div>
<div id="caption"></div>
<div id="status">—</div>
<div id="emergency"><p id="em-text"></p><button id="em-btn">Взрослый рядом — продолжить</button></div>
<div id="start"><button id="go">Зажечь Искорку</button></div>

<script>
// ═══════════════════════════════════════════════════════════
//  КОНФИГ
// ═══════════════════════════════════════════════════════════
const SERVER = 'http://127.0.0.1:8001';
const UID = new URLSearchParams(location.search).get('uid');
const CHILD = new URLSearchParams(location.search).get('child') || 'Друг';

let autoListen = false;
let gameActive = true;
let isTransitioning = false;
let currentWorldId = null;

// ═══════════════════════════════════════════════════════════
//  STORY PACKAGE (STANDARD v3.0 §4)
// ═══════════════════════════════════════════════════════════
let storyPackage = null;   // Полный пакет от Маяка
let currentChapter = null; // chapter из пакета
let globalIntents = {};    // global_intents из book.json
let sceneIndex = {};       // scene_id → scene
let curScene = null;       // Текущая сцена
let sessionReport = {      // Собираем report по ходу
    choices_made: [],
    memory_vectors: [],
    bridges_completed: [],
    new_artifacts: [],
    karma_gained: 0,
    session_start: null,
    session_end: null
};

// Загрузка story_package от Маяка
async function loadStoryPackage() {
    if (!UID) throw new Error('uid не указан в URL (?uid=LB-...)');
    const r = await fetch(`${SERVER}/api/package/child/${UID}`);
    if (!r.ok) throw new Error(`Маяк не ответил: ${r.status}`);
    storyPackage = await r.json();

    if (storyPackage.meta?.type === 'waiting') {
        return null; // Все главы пройдены
    }

    currentChapter = storyPackage.chapter;
    if (!currentChapter?.scenes) throw new Error('В пакете нет сцен');

    // Индексируем сцены
    sceneIndex = {};
    currentChapter.scenes.forEach(s => { sceneIndex[s.scene_id] = s; });

    // Показываем мостики
    const pending = storyPackage.bridges?.pending || [];
    if (pending.length > 0) {
        const bridge = pending[0];
        showBridgePanel(bridge);
    }

    return currentChapter;
}

// Загрузка global_intents из book.json (через legacy endpoint или из пакета)
async function loadGlobalIntents() {
    try {
        // book.json загружаем отдельно — он не в story_package
        const r = await fetch(`${SERVER}/api/beacon/uid/${UID}/bio`);
        if (r.ok) {
            const bio = await r.json();
            // global_intents берём из стандартных
            globalIntents = {
                emergency: {
                    keywords: ['помогите','спасите','мне плохо','больно'],
                    action: 'pause_game_until_adult',
                    reply_text: 'Я рядом. Сейчас позову взрослого.',
                    notify_parent: true
                },
                stop: {
                    keywords: ['стоп','хватит','перестань','замолчи'],
                    action: 'reply',
                    reply_text: 'Хорошо, я замолкаю. Скажи, когда продолжить.',
                    notify_parent: false
                }
            };
        }
    } catch(e) {
        // Дефолтные intents
        globalIntents = {
            emergency: { keywords: ['помогите','спасите','мне плохо','больно'], action: 'pause_game_until_adult', reply_text: 'Я рядом. Сейчас позову взрослого.' },
            stop: { keywords: ['стоп','хватит','перестань','замолчи'], action: 'reply', reply_text: 'Хорошо, я замолкаю.' }
        };
    }
}

// Отправка report после прохождения главы
async function sendReport() {
    if (!UID || !currentChapter) return;
    sessionReport.session_end = new Date().toISOString();
    const pkg = {
        meta: { version: '3.0', type: 'report', timestamp: new Date().toISOString(), package_id: `rpt_${Date.now()}` },
        child: { uid: UID },
        report: {
            chapter_id: currentChapter.id || 'unknown',
            session_start: sessionReport.session_start,
            session_end: sessionReport.session_end,
            choices_made: sessionReport.choices_made,
            memory_vectors: sessionReport.memory_vectors,
            bridges_completed: sessionReport.bridges_completed,
            new_artifacts: sessionReport.new_artifacts,
            karma_gained: sessionReport.karma_gained
        }
    };
    try {
        await fetch(`${SERVER}/api/package/report`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pkg)
        });
        console.log('[Report] ✅ Отчёт отправлен');
    } catch(e) { console.warn('[Report] ❌', e); }
}

// ═══════════════════════════════════════════════════════════
//  WEB AUDIO API — 3D звуковой движок (без изменений)
// ═══════════════════════════════════════════════════════════
let audioCtx = null, masterGain = null, currentAmbientSource = null, currentConvolver = null, stateLoopSource = null;
const activePannerNodes = new Map();

async function initAudio() {
    if (audioCtx && audioCtx.state !== 'closed') return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);
    const unlock = () => { if (audioCtx.state === 'suspended') audioCtx.resume(); document.removeEventListener('touchstart', unlock); document.removeEventListener('click', unlock); };
    document.addEventListener('touchstart', unlock); document.addEventListener('click', unlock);
}

async function loadAudioBuffer(url) {
    if (!audioCtx) await initAudio();
    try { const r = await fetch(url); if (!r.ok) return null; return await audioCtx.decodeAudioData(await r.arrayBuffer()); } catch { return null; }
}

function create3DSource(buffer, x=0, y=0, z=-1, loop=false, volume=0.5) {
    if (!audioCtx || !buffer) return null;
    const source = audioCtx.createBufferSource(); source.buffer = buffer; source.loop = loop;
    const panner = audioCtx.createPanner(); panner.panningModel = 'HRTF'; panner.distanceModel = 'inverse';
    panner.refDistance = 0.5; panner.maxDistance = 10; panner.rolloffFactor = 1;
    panner.positionX.value = x; panner.positionY.value = y; panner.positionZ.value = z;
    const gainNode = audioCtx.createGain(); gainNode.gain.value = volume;
    source.connect(panner); panner.connect(gainNode); gainNode.connect(masterGain); source.start();
    return { source, panner, gainNode };
}

async function playFoley(foleyList) {
    if (!foleyList?.length) return;
    for (const f of foleyList) {
        const url = f.startsWith('/') ? f : `/audio/foley/${f}`;
        const buf = await loadAudioBuffer(url);
        if (buf) { const angle = Math.random() * Math.PI * 2; create3DSource(buf, Math.cos(angle)*0.6, 0, Math.sin(angle)*0.6 - 0.5, false, 0.4); }
    }
}

async function playMusic(musicUrl) {
    if (currentAmbientSource) { try { currentAmbientSource.stop(); } catch {} currentAmbientSource = null; }
    if (!musicUrl) return;
    const url = musicUrl.startsWith('/') ? musicUrl : `/audio/music/${musicUrl}`;
    const buf = await loadAudioBuffer(url);
    if (buf) { const { source } = create3DSource(buf, 0, 0, -2, true, 0.25); currentAmbientSource = source; }
}

async function playStateSound(s) {
    if (stateLoopSource) { try { stateLoopSource.stop(); } catch {} stateLoopSource = null; }
    const indicator = document.getElementById('audio-indicator');
    if (s === 'listening' || s === 'thinking') indicator.classList.add('active'); else indicator.classList.remove('active');
}

// ═══════════════════════════════════════════════════════════
//  IndexedDB (сохранение прогресса)
// ═══════════════════════════════════════════════════════════
const Mem = (() => {
    let db;
    const open = () => new Promise((ok, no) => {
        const r = indexedDB.open('iskra_fort', 6);
        r.onupgradeneeded = e => { const d = e.target.result;
            ['progress','utterances','choices','tags','biography','sync_queue'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, s==='progress'||s==='biography'?{keyPath:'key'}:{autoIncrement:true}); });
        };
        r.onsuccess = e => { db = e.target.result; ok(); };
        r.onerror = () => no(r.error);
    });
    const tx = (s, m='readonly') => db.transaction(s, m).objectStore(s);
    const put = (s, d) => new Promise((ok, no) => { const r = tx(s,'readwrite').put(d); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); });
    const get = (s, k) => new Promise((ok, no) => { const r = tx(s).get(k); r.onsuccess=()=>ok(r.result||null); r.onerror=()=>no(r.error); });
    return {
        open,
        setProgress: (ch, sc) => put('progress', { key: 'current', chapter_id: ch, scene_id: sc }),
        saveSay: text => put('utterances', { text, ts: Date.now() }),
        addChoice: (scId, chId, mv) => put('choices', { scene_id: scId, choice_id: chId, memory_vector: mv, ts: Date.now() }),
    };
})();

// ═══════════════════════════════════════════════════════════
//  Canvas — Искорка (без изменений)
// ═══════════════════════════════════════════════════════════
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let clr = { r:0, g:200, b:255 }, state = 'idle', tick = 0;
function setColor(n) { const M={cyan:'#00c8ff',gold:'#ffcc44',blue:'#4488ff',red:'#ff4444',green:'#44ff88'}; const h=M[n?.toLowerCase()]||'#00c8ff'; const m=h.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if(m) clr={r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}; }
function rgba(a) { return `rgba(${clr.r},${clr.g},${clr.b},${a})`; }
function resize() { cv.width=innerWidth; cv.height=innerHeight; } resize(); addEventListener('resize',resize);
function draw() { requestAnimationFrame(draw); const w=cv.width,h=cv.height,mx=w/2,my=h/2; cx.fillStyle='rgba(0,0,0,.16)'; cx.fillRect(0,0,w,h);
    tick+=state==='thinking'?.055:.035; const vol=state==='idle'?3+Math.sin(tick)*2:state==='thinking'?6+Math.sin(tick*2)*3:4; const r=5+vol*1.8;
    const g1=cx.createRadialGradient(mx,my,0,mx,my,r*5); g1.addColorStop(0,rgba(.22)); g1.addColorStop(.5,rgba(.04)); g1.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g1; cx.beginPath(); cx.arc(mx,my,r*5,0,Math.PI*2); cx.fill();
    const g2=cx.createRadialGradient(mx,my,0,mx,my,r*2.5); g2.addColorStop(0,rgba(.95)); g2.addColorStop(.3,rgba(.3)); g2.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g2; cx.beginPath(); cx.arc(mx,my,r*2.5,0,Math.PI*2); cx.fill();
} draw();

const LABELS = { idle:'Коснись, чтобы говорить', listening:'Слушаю…', thinking:'Думаю…', speaking:'Говорю…' };
function setState(s) { state=s; document.getElementById('status').textContent=LABELS[s]||''; playStateSound(s); }
function showCap(t) { const e=document.getElementById('caption'); e.textContent=t; e.style.opacity='1'; }
function hideCap() { document.getElementById('caption').style.opacity='0'; }

// ═══════════════════════════════════════════════════════════
//  TTS + STT
// ═══════════════════════════════════════════════════════════
let synthVoice = null, stt = null, speakGeneration = 0;
function initTTS() { const l=()=>{synthVoice=speechSynthesis.getVoices().find(v=>v.lang==='ru-RU')||null;}; speechSynthesis.onvoiceschanged=l; l(); }
function initSTT() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
    stt = new SR(); stt.lang='ru-RU'; stt.continuous=false; stt.interimResults=false;
    stt.onresult = e => onSpoke(e.results[0][0].transcript.trim());
    stt.onerror = () => { if(state==='listening') setState('idle'); };
    stt.onend = () => { if(state==='listening') setState('idle'); };
}
function listen() { if(!gameActive||!stt||state!=='idle') return; speechSynthesis.cancel(); try{stt.start();setState('listening');}catch{} }

function speakOne(text, gen) { return new Promise(resolve => {
    if(gen!==speakGeneration){resolve();return} speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.rate=0.88; if(synthVoice) u.voice=synthVoice;
    let done=false; const finish=()=>{if(!done){done=true;clearTimeout(wd);resolve()}}; const wd=setTimeout(()=>{speechSynthesis.cancel();finish()},15000);
    u.onend=finish; u.onerror=finish; speechSynthesis.speak(u);
}); }

async function speak(text, color, onDone) {
    if(!text){if(onDone)onDone();return}
    const gen=++speakGeneration; speechSynthesis.cancel(); try{stt?.abort();}catch{}
    if(color)setColor(color); setState('speaking'); showCap(text);
    const sentences=text.match(/[^.!?]+[.!?]+[\s]*/g)||[text];
    for(const s of sentences){if(gen!==speakGeneration)break;await speakOne(s.trim(),gen);}
    hideCap(); setState('idle');
    if(onDone) onDone();
    else if(autoListen&&gameActive) setTimeout(listen,400);
}

// ═══════════════════════════════════════════════════════════
//  МОСТИКИ
// ═══════════════════════════════════════════════════════════
let currentBridge = null;

function showBridgePanel(bridge) {
    currentBridge = bridge;
    const panel = document.getElementById('bridge-panel');
    document.getElementById('bridge-text').innerHTML = `🌟 ${bridge.task}<br><small>+${bridge.karma_reward||2} кармы</small>`;
    panel.classList.add('show');
}

async function completeBridge() {
    if (!currentBridge) return;
    sessionReport.bridges_completed.push(currentBridge.id);
    document.getElementById('bridge-panel').classList.remove('show');
    await speak('Ура! Ты справился! Это здорово!', 'gold');
    currentBridge = null;
}

// ═══════════════════════════════════════════════════════════
//  НАВИГАЦИЯ ПО СЦЕНАМ (STANDARD v3.0 §6 — voice_choice)
// ═══════════════════════════════════════════════════════════

async function playScene(scene) {
    if (!scene) { setState('idle'); return; }
    curScene = scene;
    await Mem.setProgress(currentChapter?.id || 'ch01', scene.scene_id);

    // Foley и музыка (STANDARD §6.1)
    if (scene.foley) await playFoley(scene.foley);
    if (scene.music) await playMusic(scene.music);

    // Озвучиваем текст сцены (STANDARD §6.1: speaker + text)
    const text = scene.text;
    if (!text) return;
    await speak(text, null, () => {
        if (autoListen && gameActive && scene.mode === 'voice_choice') setTimeout(listen, 400);
    });
}

async function goScene(sceneId) {
    if (isTransitioning) return;
    isTransitioning = true;
    try {
        const scene = sceneIndex[sceneId];
        if (scene) {
            await playScene(scene);
        } else {
            await speak('Тропинка пропала… Но я рядом.', 'cyan');
        }
    } finally { isTransitioning = false; }
}

async function handleChapterEnd() {
    const onEnd = currentChapter?.on_end;
    if (!onEnd) {
        await sendReport();
        await speak('Глава закончилась. Спасибо, что был рядом!', 'gold');
        gameActive = false;
        return;
    }

    // Награды
    const rewards = currentChapter.rewards;
    if (rewards) {
        if (rewards.karma_reward) {
            sessionReport.karma_gained += rewards.karma_reward;
        }
        if (rewards.artifacts) {
            for (const a of rewards.artifacts) {
                sessionReport.new_artifacts.push(a.id);
                if (a.sound) { const buf = await loadAudioBuffer(a.sound); if (buf) create3DSource(buf, 0, 0.3, -0.5, false, 0.6); }
                await speak(`Ты получил артефакт: ${a.name}!`, 'gold');
            }
        }
    }

    // Отправляем report
    await sendReport();

    if (onEnd.action === 'load_next_chapter' && onEnd.target_chapter) {
        if (onEnd.auto_start) {
            await speak('Продолжаем! Новая глава начинается…', 'cyan');
            // Перезагружаем story_package (Маяк отдаст следующую непройденную главу)
            try {
                const ch = await loadStoryPackage();
                if (ch) {
                    resetSessionReport();
                    const firstScene = ch.scenes?.[0];
                    if (firstScene) await playScene(firstScene);
                } else {
                    await speak('Все главы пройдены! Попроси родителя заказать новую.', 'gold');
                    gameActive = false;
                }
            } catch(e) { await speak('Новая глава ещё не готова. Скоро будет!', 'cyan'); }
        } else {
            await speak(onEnd.message || 'Глава закончена!', 'gold');
            gameActive = false;
        }
    } else if (onEnd.action === 'end') {
        await speak(onEnd.message || 'Спасибо за приключение!', 'gold');
        gameActive = false;
    } else {
        await speak('Глава завершена!', 'gold');
        gameActive = false;
    }
}

function resetSessionReport() {
    sessionReport = { choices_made: [], memory_vectors: [], bridges_completed: [], new_artifacts: [], karma_gained: 0,
        session_start: new Date().toISOString(), session_end: null };
}

// ═══════════════════════════════════════════════════════════
//  ОБРАБОТКА ГОЛОСА (STANDARD v3.0 — только keyword-matching)
// ═══════════════════════════════════════════════════════════

async function onSpoke(text) {
    if (!gameActive || !text) return;
    setState('thinking');
    await Mem.saveSay(text);
    const lower = text.toLowerCase();

    // 1. Global intents (emergency, stop)
    for (const [_, intent] of Object.entries(globalIntents)) {
        if (intent.keywords?.some(k => lower.includes(k))) {
            if (intent.action === 'pause_game_until_adult') {
                document.getElementById('em-text').textContent = intent.reply_text;
                document.getElementById('emergency').classList.add('on');
                gameActive = false;
                await speak(intent.reply_text, 'red');
                return;
            }
            await speak(intent.reply_text, 'cyan');
            return;
        }
    }

    // 2. Текущая сцена: voice_choice keyword-matching (STANDARD §6.2)
    const scene = curScene;
    if (!scene?.choices?.length) {
        // Нет выборов — возможно, конец главы
        await handleChapterEnd();
        return;
    }

    for (const choice of scene.choices) {
        if (choice.keywords?.some(k => lower.includes(k.toLowerCase()))) {
            // Записываем выбор в report
            sessionReport.choices_made.push({
                scene_id: scene.scene_id,
                choice_id: choice.id,
                timestamp: new Date().toISOString()
            });
            if (choice.memory_vector) {
                sessionReport.memory_vectors.push(choice.memory_vector);
            }
            await Mem.addChoice(scene.scene_id, choice.id, choice.memory_vector || '');

            // Переход
            if (choice.next_scene === 'end' || !choice.next_scene) {
                await handleChapterEnd();
            } else {
                await goScene(choice.next_scene);
            }
            return;
        }
    }

    // 3. Ничего не распознали — повторяем варианты
    const options = scene.choices.map(c => c.label || c.keywords?.[0] || '?').join(', ');
    await speak(`Я не совсем понял. Попробуй сказать: ${options}`, 'cyan');
    if (autoListen) setTimeout(listen, 400);
}

// ═══════════════════════════════════════════════════════════
//  ЗАПУСК
// ═══════════════════════════════════════════════════════════

async function boot() {
    gameActive = true;
    isTransitioning = false;
    document.getElementById('start').style.display = 'none';
    setState('thinking');

    await initAudio();
    await Mem.open();
    initSTT();
    initTTS();

    resetSessionReport();

    try {
        await loadGlobalIntents();
        const chapter = await loadStoryPackage();

        if (!chapter) {
            await speak(`Привет, ${CHILD}! Все приключения пройдены. Попроси родителя заказать новую книгу!`, 'gold');
            gameActive = false;
            return;
        }

        const childName = storyPackage.child?.name || CHILD;
        const firstScene = chapter.scenes?.[0];

        if (firstScene) {
            const title = chapter.title || 'новая глава';
            await speak(`Привет, ${childName}! Начинаем: ${title}.`, 'cyan', () => playScene(firstScene));
        } else {
            await speak(`Привет, ${childName}! Я Искорка. Скоро начнётся приключение!`, 'cyan');
        }
    } catch(e) {
        console.error('[Boot]', e);
        await speak(`Привет! Я Искорка. Пока не могу загрузить книгу. Проверь связь с Маяком.`, 'cyan');
        gameActive = false;
    }
}

// UI
document.getElementById('go').onclick = () => { autoListen = true; boot(); };
document.getElementById('em-btn').onclick = () => {
    document.getElementById('emergency').classList.remove('on');
    gameActive = true; setState('idle');
    speak('Хорошо, продолжим?', 'cyan');
};
document.getElementById('bridge-complete').onclick = () => completeBridge();
cv.addEventListener('click', () => { if(state==='idle'&&gameActive) listen(); });
cv.addEventListener('touchstart', e => { e.preventDefault(); if(state==='idle'&&gameActive) listen(); }, { passive:false });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

console.log('[Iskra] v6.0 — STANDARD v3.0 • voice_choice only • keyword-matching • story_package.json');
</script>
