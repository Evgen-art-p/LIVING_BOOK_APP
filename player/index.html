<script>
// ════════════════════════════════════════════════════════════════════
//  КОНФИГ
// ════════════════════════════════════════════════════════════════════
const DEV_MODE   = true;
const SERVER_URL = 'http://127.0.0.1:8001';  // Маяк v4.0 — НЕ МЕНЯТЬ!
const CHILD_NAME = 'Женя';                   // Имя ребёнка — строго как папка в books/
const SESSION_ID = 'session_001';

// Путь к книгам — через Маяк, а не напрямую!
// ВНИМАНИЕ: плеер НЕ читает книги с диска, он просит их у Маяка
const BOOKS_API_URL = `${SERVER_URL}/api/beacon/stories/${encodeURIComponent(CHILD_NAME)}`; 
// Добавить после SERVER_URL:
const BOOK_PATH = `${SERVER_URL}/api/beacon/stories/${encodeURIComponent(CHILD_NAME)}/`;
 

// Цвета CSS для ui_pulse_color из пакета
const COLOR_MAP = {
    'красный':     '#ff4444',
    'синий':       '#4488ff',
    'зелёный':     '#44ff88',
    'зеленый':     '#44ff88',
    'жёлтый':      '#ffee44',
    'желтый':      '#ffee44',
    'фиолетовый':  '#aa44ff',
    'розовый':     '#ff88cc',
    'оранжевый':   '#ff8844',
    'orange':      '#ff8844',
    'голубой':     '#44ddff',
    'белый':       '#ffffff',
    'чёрный':      '#666688',
    'черный':      '#666688',
    'золотой':     '#ffcc44',
    'серебряный':  '#aabbcc',
    // системные цвета
    'cyan':   '#00c8ff',
    'yellow': '#ffee44',
    'green':  '#44ff88',
    'blue':   '#4488ff',
    'red':    '#ff4444',
    'white':  '#ffffff',
};

function resolveColor(name) {
    if (!name) return COLOR_MAP['cyan'];
    return COLOR_MAP[name.toLowerCase()] || COLOR_MAP['cyan'];
}

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: MEMORY — IndexedDB, Zero Data
// ════════════════════════════════════════════════════════════════════
const Memory = (() => {
    const DB_NAME = 'iskra_fort', DB_VERSION = 1;
    let db = null;

    function open() {
        return new Promise((res, rej) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = e => {
                const d = e.target.result;
                ['progress','utterances','choices','tags','biography','sync_queue']
                    .forEach(store => {
                        if (!d.objectStoreNames.contains(store))
                            d.createObjectStore(store,
                                store === 'progress' || store === 'biography'
                                    ? { keyPath: 'key' }
                                    : { autoIncrement: true }
                            );
                    });
            };
            req.onsuccess = e => { db = e.target.result; res(db); };
            req.onerror   = () => rej(req.error);
        });
    }

    function tx(store, mode = 'readonly') {
        return db.transaction(store, mode).objectStore(store);
    }
    function put(store, data) {
        return new Promise((res, rej) => {
            const r = tx(store, 'readwrite').put(data);
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
    }
    function getRecord(store, key) {
        return new Promise((res, rej) => {
            const r = tx(store).get(key);
            r.onsuccess = () => res(r.result || null);
            r.onerror   = () => rej(r.error);
        });
    }
    function getAll(store) {
        return new Promise((res, rej) => {
            const r = tx(store).getAll();
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
    }

    // Прогресс
    async function getProgress(sid)               { return getRecord('progress', sid); }
    async function setProgress(sid, chId, scId, turns = 0) {
        return put('progress', { key: sid, chapter_id: chId, scene_id: scId, turn_count: turns });
    }
    async function incrementTurn(sid) {
        const p = await getProgress(sid);
        if (p) { p.turn_count++; await put('progress', p); return p.turn_count; }
        return 0;
    }

    // Биографическая память (ключ-значение)
    async function setBio(key, value) {
        await put('biography', { key, value });
        await put('sync_queue', { type: 'bio', key, ts: Date.now() });
    }
    async function getBio(key) {
        const r = await getRecord('biography', key);
        return r ? r.value : null;
    }

    // События
    async function saveUtterance(sid, text) {
        await put('utterances', { session_id: sid, text, ts: Date.now() });
        await put('sync_queue', { type: 'utterance', session_id: sid, ts: Date.now() });
    }
    async function saveChoice(sid, choiceId) {
        await put('choices',   { session_id: sid, choice_id: choiceId, ts: Date.now() });
        await put('sync_queue',{ type: 'choice', session_id: sid, choice_id: choiceId, ts: Date.now() });
    }
    async function addTag(sid, tag) {
        await put('tags',      { session_id: sid, tag, ts: Date.now() });
        await put('sync_queue',{ type: 'tag', session_id: sid, tag, ts: Date.now() });
    }

    async function getSyncQueue()  { return getAll('sync_queue'); }
    async function clearSyncQueue(){ return new Promise((res,rej) => {
        const r = tx('sync_queue','readwrite').clear();
        r.onsuccess = () => res(); r.onerror = () => rej(r.error);
    }); }

    return {
        open, getProgress, setProgress, incrementTurn,
        setBio, getBio,
        saveUtterance, saveChoice, addTag,
        getSyncQueue, clearSyncQueue,
    };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: MEMORY TEMPLATE — подставляет {memory:key} в строки
// ════════════════════════════════════════════════════════════════════
const MemoryTemplate = (() => {
    // Заменяет все вхождения {memory:KEY} на значение из IndexedDB
    async function resolve(str) {
        if (!str || !str.includes('{memory:')) return str;
        const pattern = /\{memory:([^}]+)\}/g;
        const matches = [...str.matchAll(pattern)];
        let result = str;
        for (const m of matches) {
            const key   = m[1];
            const value = await Memory.getBio(key) || '';
            result = result.replace(m[0], value);
        }
        return result;
    }

    // Разрешает объект сцены: text, audio_file_template, ui_pulse_color
    async function resolveEvent(event) {
        if (!event) return event;
        const resolved = { ...event };
        if (resolved.audio_file_template) {
            const path = await resolve(resolved.audio_file_template);
            resolved.audio_file = path || resolved.audio_file_fallback;
        }
        if (resolved.ui_pulse_color) {
            const color = await resolve(resolved.ui_pulse_color);
            resolved.ui_pulse_color = color || resolved.ui_pulse_color_fallback || 'cyan';
        }
        return resolved;
    }

    // Разрешает scripted_response (для fallback в crystal_cave и т.п.)
    async function resolveResponse(resp) {
        if (!resp) return resp;
        const r = { ...resp };
        if (r.ui_pulse_color) {
            r.ui_pulse_color = await resolve(r.ui_pulse_color) || 'cyan';
        }
        return r;
    }

    return { resolve, resolveEvent, resolveResponse };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: BOOK ENGINE — читает JSON офлайн
// ════════════════════════════════════════════════════════════════════
const BookEngine = (() => {
    let book = null;
    const cache = {};

    async function loadJSON(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`404: ${path}`);
        return res.json();
    }

    async function init() {
        // Загружаем метаданные книги через API Маяка
        const metaUrl = `${SERVER_URL}/api/beacon/stories/${encodeURIComponent(CHILD_NAME)}/meta`;
        const res = await fetch(metaUrl);
        if (!res.ok) throw new Error(`Не удалось загрузить метаданные: ${res.status}`);
        
        book = await res.json();
        
        // Загружаем первую главу
        const firstChId = book.starting_chapter;
        await _loadChapter(firstChId);
        
        console.log('[BookEngine] Книга загружена через Маяк:', book.title);
    }

    async function _loadChapter(chId) {
    if (cache[chId]) return cache[chId];
    
    // Загружаем главу через API Маяка
    const chapterUrl = `${SERVER_URL}/api/beacon/stories/${encodeURIComponent(CHILD_NAME)}/chapters/${encodeURIComponent(chId)}`;
    const res = await fetch(chapterUrl);
    if (!res.ok) throw new Error(`Глава не найдена: ${chId}`);
    
    const data = await res.json();
    if (!data || !data.scenes) {
        throw new Error(`Файл главы ${chId} пуст или повреждён!`);
    }
    
    // Индексируем сцены
    data._index = {};
    for (const s of data.scenes) {
        const sid = s.scene_id || s.id; if (sid) { data._index[sid] = s; s.scene_id = sid; }
    }
    
    cache[chId] = data;
    console.log(`[BookEngine] Глава ${chId} загружена через Маяк`);
    return data;
}

    async function getScene(chId, sceneId) {
        const ch = await _loadChapter(chId);
        return ch._index[sceneId] || null;
    }

    async function findScene(sceneId) {
        for (const meta of book.chapters) {
            const ch = await _loadChapter(meta.id);
            if (ch._index[sceneId]) return { chapterId: meta.id, scene: ch._index[sceneId] };
        }
        return null;
    }

    function getStarting()       { return { chapterId: book.starting_chapter, sceneId: book.starting_scene }; }
    function getGlobalIntents()  { return book.global_intents || {}; }

    // Последний резерв: первая сцена из главы по порядку в массиве
    async function getFirstScene(chId) {
        const ch = await _loadChapter(chId);
        return ch?.scenes?.[0] || null;
    }

    return { init, getScene, findScene, getStarting, getGlobalIntents, getFirstScene };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: GLOBAL INTENTS — перехватчик ДО локальных intent'ов
//  Включая Emergency Stop (Главный Стоп-Кран)
// ════════════════════════════════════════════════════════════════════
const GlobalIntents = (() => {
    function match(text) {
        const t    = text.toLowerCase();
        const ints = BookEngine.getGlobalIntents();
        for (const [name, intent] of Object.entries(ints)) {
            if (intent.keywords.some(k => t.includes(k))) {
                return { name, intent };
            }
        }
        return null;
    }

    async function handle(text) {
        const hit = match(text);
        if (!hit) return false;

        const { name, intent } = hit;
        console.warn('[GlobalIntent]', name);

        if (intent.action === 'pause_game_until_adult') {
            triggerEmergencyStop(intent);
            return true;
        }

        // Другие глобальные интенты — просто ответить и вернуть true
        const resolved = await MemoryTemplate.resolveResponse(intent);
        speak(resolved.reply_text, resolved.reply_audio, resolved.ui_pulse_color || 'red');
        if (intent.notify_parent) {
            await Memory.addTag(SESSION_ID, 'parent_alert');
        }
        return true;
    }

    return { handle };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: SOFT BOUNDARY — «Дух Вредности» (приоритет 2)
//  Проверяется ПОСЛЕ emergency, НО ДО сюжетных intent'ов сцены
// ════════════════════════════════════════════════════════════════════
const SoftBoundary = (() => {
    // Ключевые слова захардкожены в движке как дополнительная защита
    // (даже если в JSON забыли указать)
    const FALLBACK_KEYWORDS = [
        'не хочу','отстань','глупый','дурак','дура',
        'сломаю','плохой','надоело','уйди','замолчи','заткнись',
    ];

    function matchInScene(text, scene) {
        const responses = scene?.scripted_responses || {};
        const intent    = responses['intent_boundary_testing'];
        if (!intent) return null;
        const t = text.toLowerCase();
        return intent.keywords.some(k => t.includes(k)) ? intent : null;
    }

    function matchFallback(text) {
        const t = text.toLowerCase();
        return FALLBACK_KEYWORDS.some(k => t.includes(k));
    }

    async function handle(text, scene) {
        const intent = matchInScene(text, scene) || (matchFallback(text) ? _defaultIntent() : null);
        if (!intent) return false;

        console.log('[SoftBoundary] Дух Вредности перехвачен');

        // Оранжевый пульс
        setIskraColor('orange');
        // Автосброс к базовому голубому после ответа
        const prevOnDone = () => {
            setTimeout(() => setIskraColor('cyan'), 1200);
            setState('idle');
            hideCaption();
        };

        setState('speaking');
        showCaption(intent.reply_text);

        const audio = intent.reply_audio ? new Audio(BOOK_PATH + intent.reply_audio) : null;
        if (audio) {
            audio.onended = prevOnDone;
            audio.onerror = () => { speakTTS(intent.reply_text); prevOnDone(); };
            audio.play().catch(() => { speakTTS(intent.reply_text); prevOnDone(); });
        } else {
            const u = new SpeechSynthesisUtterance(intent.reply_text);
            u.lang  = 'ru-RU'; u.rate = 0.88; u.pitch = 1.1;
            if (synthVoice) u.voice = synthVoice;
            u.onend = u.onerror = prevOnDone;
            speechSynthesis.speak(u);
        }

        // Сохраняем вектор
        await Memory.addTag(SESSION_ID, intent.memory_vector || 'tested_boundaries_mild');
        await Memory.saveChoice(SESSION_ID, 'boundary_test');

        return true;
    }

    function _defaultIntent() {
        return {
            reply_speaker: 'iskra',
            reply_text:    'Ой-ой-ой, дух Вредности пробрался! Но мы умнее — фух, улетел! Так, продолжаем?',
            reply_audio:   'audio/isk_boundary_cave.mp3',
            memory_vector: 'tested_boundaries_mild',
            ui_pulse_color:'orange',
        };
    }

    return { handle };
})();
// ════════════════════════════════════════════════════════════════════
function triggerEmergencyStop(intent) {
    setIskraColor('red');
    setState('speaking');

    const screen = document.getElementById('emergency-screen');
    document.getElementById('emergency-text').textContent = intent.reply_text;
    screen.classList.add('active');

    // Озвучить
    speakText(intent.reply_text, intent.reply_audio);

    // Лог для Маяка
    Memory.addTag(SESSION_ID, 'emergency_triggered');
}

document.getElementById('emergency-resume').addEventListener('click', () => {
    document.getElementById('emergency-screen').classList.remove('active');
    setIskraColor('cyan');
    setState('idle');
    speak('Я здесь. Рада, что взрослый рядом. Продолжим?');
});

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: DIALOG ENGINE — локальные intent'ы + биопамять
// ════════════════════════════════════════════════════════════════════
const Dialog = (() => {
    const TAG_MAP = {
        'смелость':     ['пещер','пойти','не боюсь','вперёд'],
        'осторожность': ['подождать','остаться','страшно'],
        'любопытство':  ['почему','что это','расскажи','интересно'],
        'грусть':       ['грустно','плохо','устал','скучно'],
        'радость':      ['здорово','весело','нравится','люблю'],
    };

    // Найти совпадение в scripted_responses сцены
    function matchIntent(text, responses) {
        const t = text.toLowerCase();
        for (const [key, resp] of Object.entries(responses)) {
            if (key === 'fallback') continue;
            if (resp.keywords && resp.keywords.some(k => t.includes(k.toLowerCase()))) {
                return { key, resp };
            }
        }
        return null;
    }

    async function getReply(text, scene) {
        const responses = scene.scripted_responses || {};
        const hit = matchIntent(text, responses);
        const resp = hit ? hit.resp : (responses.fallback || null);
        if (!resp) return { text: `Я слышу тебя. Расскажи ещё.`, audio: null, color: 'cyan', vector: null, matchedKeyword: null };

        // Найденное ключевое слово (для {matched_keyword})
        let matchedKeyword = null;
        if (hit && resp.keywords) {
            const t = text.toLowerCase();
            matchedKeyword = resp.keywords.find(k => t.includes(k.toLowerCase())) || null;
        }

        return {
            text:           resp.reply_text,
            audio:          resp.reply_audio,
            color:          resp.ui_pulse_color || 'cyan',
            vector:         resp.memory_vector  || null,
            memoryKey:      resp.memory_key     || null,
            matchedKeyword,
            audioChange:    resp.audio_layer_change || null,
        };
    }

    async function saveVector(vector, memoryKey, matchedKeyword) {
        if (!vector) return;
        // Подстановка {matched_keyword}
        const resolved = vector.replace('{matched_keyword}', matchedKeyword || '');
        await Memory.addTag(SESSION_ID, resolved);
        // Биографическая память
        if (memoryKey && matchedKeyword) {
            await Memory.setBio(memoryKey, matchedKeyword);
            console.log(`[Bio] ${memoryKey} = ${matchedKeyword}`);
        }
    }

    async function autoTag(text) {
        const t = text.toLowerCase();
        for (const [tag, words] of Object.entries(TAG_MAP)) {
            if (words.some(w => t.includes(w))) await Memory.addTag(SESSION_ID, tag);
        }
    }

    return { getReply, saveVector, autoTag };
})();

// ════════════════════════════════════════════════════════════════════
//  CANVAS + ИСКОРКА
// ════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let iskraColor  = { r: 0, g: 200, b: 255 };   // текущий цвет (RGB)
let iskraState  = 'idle';
let audioCtx, analyser, micData;
let idleTick = 0, spinTick = 0;

function setIskraColor(nameOrHex) {
    const hex = COLOR_MAP[nameOrHex?.toLowerCase()] || nameOrHex || '#00c8ff';
    const m   = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    if (m) iskraColor = { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) };
}

function c(alpha) {
    const { r, g, b } = iskraColor;
    return `rgba(${r},${g},${b},${alpha})`;
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function drawIskra(vol = 0) {
    const cx = canvas.width / 2, cy = canvas.height / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (iskraState === 'idle')     { idleTick += 0.035; vol = 3 + Math.sin(idleTick) * 2; }
    if (iskraState === 'thinking') { spinTick += 0.055; vol = 6 + Math.sin(spinTick * 2) * 3; }

    const r = 5 + vol * 1.8;

    const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 5);
    aura.addColorStop(0, c(0.22)); aura.addColorStop(0.5, c(0.04)); aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(cx, cy, r * 5, 0, Math.PI*2); ctx.fill();

    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
    grd.addColorStop(0, c(0.95)); grd.addColorStop(0.3, c(0.3)); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, r * 2.5, 0, Math.PI*2); ctx.fill();

    if (micData && (iskraState === 'listening' || iskraState === 'speaking')) {
        analyser.getByteFrequencyData(micData);
        ctx.beginPath();
        for (let i = 0; i < micData.length; i += 4) {
            const a = (i / micData.length) * Math.PI * 2;
            const d = micData[i] * 1.4;
            ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
            ctx.lineTo(cx + Math.cos(a)*(r+d), cy + Math.sin(a)*(r+d));
        }
        ctx.strokeStyle = c(0.3); ctx.lineWidth = 1; ctx.stroke();
    }

    if (iskraState === 'thinking') {
        for (let i = 0; i < 12; i++) {
            const a = spinTick + (i/12)*Math.PI*2;
            const d = 28 + Math.sin(spinTick*3+i)*14;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
            ctx.lineTo(cx + Math.cos(a)*(r+d), cy + Math.sin(a)*(r+d));
            ctx.strokeStyle = c(0.2); ctx.lineWidth = 0.8; ctx.stroke();
        }
    }
}

function getVol() {
    if (!analyser || !micData) return 0;
    analyser.getByteFrequencyData(micData);
    let s = 0; for (let i=0; i<128; i++) s += micData[i];
    return s/128;
}

(function loop() { requestAnimationFrame(loop); drawIskra(getVol()); })();

const STATUS_LABELS = { idle:'Коснись, чтобы говорить', listening:'Я слышу тебя…', thinking:'Думаю…', speaking:'Говорю…' };
function setState(s) { iskraState = s; document.getElementById('status').textContent = STATUS_LABELS[s] || ''; }
function showCaption(t) { const el=document.getElementById('caption'); el.textContent=t; el.style.opacity='1'; }
function hideCaption() { document.getElementById('caption').style.opacity='0'; }

// ════════════════════════════════════════════════════════════════════
//  STT
// ════════════════════════════════════════════════════════════════════
let speechRec = null;
function initSTT() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    speechRec = new SR();
    speechRec.lang = 'ru-RU'; speechRec.continuous = false; speechRec.interimResults = false;
    speechRec.onresult = e => onChildSpoke(e.results[0][0].transcript.trim());
    speechRec.onerror  = e => { if (e.error !== 'no-speech') setState('idle'); };
    speechRec.onend    = () => { if (iskraState === 'listening') setState('idle'); };
}
function startListening() {
    if (!speechRec || iskraState === 'listening') return;
    // Ждём только idle или speaking (не прерываем thinking)
    if (iskraState === 'thinking') return;
    try { speechRec.start(); setState('listening'); } catch(e) {}
}

// ════════════════════════════════════════════════════════════════════
//  TTS + АУДИО
// ════════════════════════════════════════════════════════════════════
let synthVoice = null;
function initTTS() {
    const load = () => { const v = speechSynthesis.getVoices(); synthVoice = v.find(v=>v.lang==='ru-RU')||null; };
    speechSynthesis.onvoiceschanged = load; load();
}

function speakText(text, audioFile) {
    // ВРЕМЕННО: полностью игнорируем аудиофайлы, используем только TTS
    // Это уберёт все ошибки 404
    if (text) {
        speakTTS(text);
    }
}

function speakTTS(text) {
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; u.rate = 0.88; u.pitch = 1.05;
    if (synthVoice) u.voice = synthVoice;
    speechSynthesis.speak(u);
}

// Флаг: автослушание активно (после первого касания — всегда слушаем)
let autoListen = false;

function speak(text, audioFile, colorName, onDone) {
    if (!text) { 
        if (onDone) onDone();
        return; 
    }
    
    if (colorName) setIskraColor(colorName);
    setState('speaking');
    showCaption(text);
    
    // Игнорируем audioFile, всегда используем TTS
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.88;
    utterance.pitch = 1.05;
    if (synthVoice) utterance.voice = synthVoice;
    
    utterance.onend = () => {
        hideCaption();
        if (onDone) onDone();
        if (autoListen) {
            setTimeout(() => startListening(), 400);
        } else {
            setState('idle');
        }
    };
    
    utterance.onerror = () => {
        hideCaption();
        if (onDone) onDone();
        setState('idle');
    };
    
    speechSynthesis.speak(utterance);
}

// ════════════════════════════════════════════════════════════════════
//  НАВИГАЦИЯ ПО КНИГЕ
// ════════════════════════════════════════════════════════════════════
let currentScene = null, currentChapterId = null;

async function loadCurrentScene() {
    let p = await Memory.getProgress(SESSION_ID);
    const start = BookEngine.getStarting(); // chapterId + sceneId из book.json

    // Сброс: если прогресс пуст или scene_id отсутствует
    if (!p || !p.scene_id) {
        console.log("Лока: Прогресс пуст — ставлю старт из конфига...");
        await Memory.setProgress(SESSION_ID, start.chapterId, start.sceneId, 0);
        p = { chapter_id: start.chapterId, scene_id: start.sceneId, turn_count: 0 };
    }

    currentChapterId = p.chapter_id;
    currentScene = await BookEngine.getScene(p.chapter_id, p.scene_id);

    // Если сохранённая сцена не найдена — сбрасываем на starting_scene из конфига
    if (!currentScene) {
        console.warn('Лока: Сохранённая сцена не найдена — сбрасываю на стартовую...');
        await Memory.setProgress(SESSION_ID, start.chapterId, start.sceneId, 0);
        currentChapterId = start.chapterId;
        currentScene = await BookEngine.getScene(start.chapterId, start.sceneId);
    }

    // Последний резерв: берём первую сцену из главы по индексу
    if (!currentScene) {
        console.error('Лока: Стартовая сцена тоже не найдена! Беру первую из главы...');
        currentScene = await BookEngine.getFirstScene(start.chapterId);
    }

    return currentScene;
}

async function playScene(scene) {
    // Fix 2: защита от null — не падаем на .intro_event
    if (!scene) { console.warn('[playScene] scene is null, aborting'); setState('idle'); return; }
    currentScene = scene;
    if (!scene.intro_event) { setState('idle'); return; }

    // Разрешить шаблоны {memory:*} во вступлении
    const intro = await MemoryTemplate.resolveEvent(scene.intro_event);

    // Применить цвет Искорки
    if (intro.ui_pulse_color) setIskraColor(intro.ui_pulse_color);

    speak(intro.text, intro.audio_file, null, () => {
        if (scene.mode === 'ask_choice') showChoiceHint(scene);
        else setState('idle');
    });
}

function showChoiceHint(scene) {
    const labels = (scene.choices || []).map(c => c.label).join(' · ');
    showCaption(labels);
}

// ════════════════════════════════════════════════════════════════════
//  ГЛАВНАЯ ЛОГИКА — обработка речи ребёнка
// ════════════════════════════════════════════════════════════════════

async function onChildSpoke(text) {
    console.log('🔴🔴🔴 onChildSpoke ВЫЗВАНА, текст:', text);
    
    if (!text) {
        console.log('❌ текст пустой');
        return;
    }
    
    console.log('🔍 _dbReady =', window._dbReady);
    
    if (!window._dbReady) {
        console.warn('База ещё не готова, пропускаю фразу:', text);
        return;
    }
    
    console.log('🗣️ ПОЛУЧЕНА ФРАЗА:', text);
    console.log('📌 currentScene существует?', !!currentScene);
    console.log('📌 currentScene:', currentScene);
    
    if (currentScene) {
        console.log('📌 scene_id:', currentScene.scene_id);
        console.log('📌 mode:', currentScene.mode);
    }
    
    setState('thinking');
    console.log('🟡 состояние changed -> thinking');
    
    try {
        console.log('💾 сохраняю utterance...');
        await Memory.saveUtterance(SESSION_ID, text);
        console.log('✅ utterance сохранён');
        
        console.log('🏷️ autoTag...');
        await Dialog.autoTag(text);
        console.log('✅ autoTag готов');
    } catch (err) {
        console.error('❌ Ошибка при сохранении:', err);
    }
    
    console.log('🛡️ проверяю GlobalIntents...');
    const handled = await GlobalIntents.handle(text);
    console.log('🛡️ GlobalIntents результат:', handled);
    if (handled) return;
    
    console.log('😈 проверяю SoftBoundary...');
    const softHandled = await SoftBoundary.handle(text, currentScene);
    console.log('😈 SoftBoundary результат:', softHandled);
    if (softHandled) return;
    
    console.log('🎯 перехожу к локальным интентам...');
    
    const scene = currentScene;
    if (!scene) { 
        console.log('❌ scene нет, говорю дефолт');
        speak(`Расскажи мне, ${CHILD_NAME}.`); 
        return;
    }
    
    console.log('🎯 scene.mode =', scene.mode);
    
    if (scene.mode === 'ask_choice') {
        console.log('🔘 режим ask_choice, ищу match...');
        const choice = matchChoice(text, scene.choices || []);
        console.log('🔘 найденный choice:', choice);
        if (choice) {
            await Memory.saveChoice(SESSION_ID, choice.id);
            await Memory.addTag(SESSION_ID, choice.memory_vector || choice.id);
            const found = await BookEngine.findScene(choice.next_scene);
            if (found) {
                await Memory.setProgress(SESSION_ID, found.chapterId, choice.next_scene, 0);
                speak('Хорошо.', null, null, () => playScene(found.scene));
            }
            return;
        }
        const fallback = scene.scripted_responses?.fallback;
        if (fallback) speak(fallback.reply_text, fallback.reply_audio); 
        else speak(`Скажи: ${(scene.choices||[]).map(c=>c.label).join(' или ')}?`);
        return;
    }
    
    console.log('💬 free_talk режим, вызываю Dialog.getReply...');
    const reply = await Dialog.getReply(text, scene);
    console.log('💬 reply получен:', reply);
    
    // ── Гибридный Intent: если локальный ответ слаб → идём в LLM ──
    if (reply.text.includes('Расскажи ещё') || reply.text.includes('Я слышу тебя')) {
        console.log('☁️ Локальный fallback → запрос к /api/free_talk...');
        try {
            const res = await fetch(`${SERVER_URL}/api/free_talk`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    child_text: text,
                    scene_id: currentScene?.scene_id || 'unknown',
                    chapter_id: currentChapterId || '',
                    child_name: CHILD_NAME,
                    session_id: SESSION_ID,
                }),
                signal: AbortSignal.timeout(5000),
            });
            const cloud = await res.json();
            if (cloud.text && !cloud.blocked) {
                reply.text = cloud.text;
                reply.color = cloud.color || 'cyan';
                console.log('✅ Ответ от Маяка:', cloud.text);
                // Помечаем в памяти что был LLM-ответ
                await Memory.saveUtterance(SESSION_ID, text + ' [LLM]');
            }
        } catch(e) {
            console.warn('⚠️ Маяк недоступен, используем локальный fallback');
        }
    }
    
    speak(reply.text, null, reply.color);
}

async function checkForNewBooks() {

// ════════════════════════════════════════════════════════════════════
//  НОЧНОЙ МАЯК
// ════════════════════════════════════════════════════════════════════
const NightBeacon = (() => {
    const URL = 'http://127.0.0.1:8001/beacon';
    const KEY = 'iskra_last_sync';
    const DAY = 86400000;
    
    async function trySync() {
        if (Date.now() - parseInt(localStorage.getItem(KEY)||'0') < DAY) return;
        if (navigator.connection?.type === 'cellular') return;
        const queue = await Memory.getSyncQueue();
        if (!queue.length) return;
        
        const batch = {
            device_id:  getDeviceId(),
            session_id: SESSION_ID,
            synced_at:  new Date().toISOString(),
            events: queue.map(e => ({
                type: e.type,
                ts:   e.ts,
                ...(e.choice_id && { choice_id: e.choice_id }),
                ...(e.tag       && { tag: e.tag }),
                ...(e.key       && { bio_key: e.key }),
            })),
            llm_stats: {  // ← ЭТОТ БЛОК НУЖНО ДОБАВИТЬ (опционально)
                total_requests: window._llmRequestCount || 0,
                cache_hits: window._llmCacheHits || 0,
                estimated_tokens: window._llmTokensUsed || 0,
            },
        };
        
        if (DEV_MODE) {
            console.log('[NightBeacon] DEV_MODE активен — батч не отправлен:', batch);
            return;
        }
        
        try {
            const res = await fetch(URL, { 
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify(batch), 
                signal:AbortSignal.timeout(10000) 
            });
            if (res.ok) { 
                await Memory.clearSyncQueue(); 
                localStorage.setItem(KEY, Date.now().toString()); 
            }
        } catch(e) { console.warn('[NightBeacon] Оффлайн'); }
    }
    
    function getDeviceId() {
        let id = localStorage.getItem('iskra_device_id');
        if (!id) { 
            id = 'dev_' + Math.random().toString(36).slice(2); 
            localStorage.setItem('iskra_device_id', id); 
        }
        return id;
    }
    
    return { trySync };
})();

// ════════════════════════════════════════════════════════════════════
//  ЗАПУСК
// ════════════════════════════════════════════════════════════════════

async function start() {
    document.getElementById('start-screen').style.display = 'none';
    setState('thinking');

    // 1. Открываем базу
    await Memory.open();
    window._dbReady = true;
    console.log('✅ База данных готова');

    // 2. Включаем микрофон
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        micData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e) { console.error('[Mic]', e); }

    // 3. Инициализируем голос и логику
    initSTT(); 
    initTTS();

    try {
        await BookEngine.init();
        const scene = await loadCurrentScene();
        
        // Проверка обновлений
        setTimeout(() => checkForNewBooks(), 2000); 

        speak(`Привет, ${CHILD_NAME}. Добро пожаловать в Грондхейм.`, null, 'cyan', () => playScene(scene));
    } catch(e) {
        console.warn('[BookEngine]', e);
        speak(`Привет, ${CHILD_NAME}. Я здесь.`, null, 'cyan', () => setState('idle'));
    }

    setTimeout(() => NightBeacon.trySync(), 5000);
}
