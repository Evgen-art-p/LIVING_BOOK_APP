<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>Грондхейм: Искорка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { position: absolute; top: 0; left: 0; touch-action: none; }

        #status {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: #334;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            transition: color 0.6s;
            white-space: nowrap;
        }
        #caption {
            position: absolute;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,200,255,0.4);
            font-size: 13px;
            letter-spacing: 0.5px;
            max-width: 75vw;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.8s;
            opacity: 0;
            line-height: 1.5;
        }
        #start-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #start-btn {
            background: transparent;
            border: 1px solid rgba(0,200,255,0.3);
            color: rgba(0,200,255,0.6);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;

            cursor: pointer;
            transition: all 0.4s;
        }
        #start-btn:hover { border-color: rgba(0,200,255,0.8); color: rgba(0,200,255,0.9); }
        #offline-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(0,200,100,0.35);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="caption"></div>
    <div id="status">—</div>
    <div id="offline-badge">⬡ форт</div>
    <div id="start-screen">
        <button id="start-btn">Зажечь Искорку</button>
    </div>

<script>
// ════════════════════════════════════════════════════════════════════
//  КОНФИГ
// ════════════════════════════════════════════════════════════════════
const BOOK_PATH   = '../books/grondheim_01/';
const CHILD_NAME  = 'Артём';               // TODO: onboarding
const SESSION_ID  = 'session_001';

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: BOOK ENGINE  — читает JSON-сцены локально, без сервера
// ════════════════════════════════════════════════════════════════════
const BookEngine = (() => {
    let book = null;
    const chapterCache = {};

    async function loadJSON(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`Не найдено: ${path}`);
        return res.json();
    }

    async function init() {
        book = await loadJSON(BOOK_PATH + 'book.json');
        console.log('[BookEngine] Книга:', book.title);
        // Предзагрузим первую главу
        const firstChId = book.starting_chapter;
        await loadChapter(firstChId);
    }

    async function loadChapter(chId) {
        if (chapterCache[chId]) return chapterCache[chId];
        const meta = book.chapters.find(c => c.id === chId);
        if (!meta) throw new Error(`Глава не найдена: ${chId}`);
        const data = await loadJSON(BOOK_PATH + meta.file);
        data._index = {};
        for (const s of data.scenes) data._index[s.id] = s;
        chapterCache[chId] = data;
        return data;
    }

    async function getScene(chapterId, sceneId) {
        const ch = await loadChapter(chapterId);
        const scene = ch._index[sceneId];
        if (!scene) throw new Error(`Сцена не найдена: ${sceneId}`);
        return scene;
    }

    async function findScene(sceneId) {
        // Ищем сцену по всем главам
        for (const meta of book.chapters) {
            const ch = await loadChapter(meta.id);
            if (ch._index[sceneId]) return { chapterId: meta.id, scene: ch._index[sceneId] };
        }
        return null;
    }

    function getStarting() {
        return { chapterId: book.starting_chapter, sceneId: book.starting_scene };
    }

    async function getCharacter(charId) {
        const meta = book.characters.find(c => c.id === charId);
        if (!meta) return {};
        return loadJSON(BOOK_PATH + meta.file);
    }

    return { init, getScene, findScene, getStarting, getCharacter };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: MEMORY (IndexedDB) — всё локально, Zero Data
// ════════════════════════════════════════════════════════════════════
const Memory = (() => {
    const DB_NAME    = 'iskra_fort';
    const DB_VERSION = 1;
    let db = null;

    function open() {
        return new Promise((res, rej) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = e => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains('progress'))
                    d.createObjectStore('progress', { keyPath: 'session_id' });
                if (!d.objectStoreNames.contains('utterances'))
                    d.createObjectStore('utterances', { autoIncrement: true });
                if (!d.objectStoreNames.contains('choices'))
                    d.createObjectStore('choices', { autoIncrement: true });
                if (!d.objectStoreNames.contains('tags'))
                    d.createObjectStore('tags', { autoIncrement: true });
                if (!d.objectStoreNames.contains('sync_queue'))
                    d.createObjectStore('sync_queue', { autoIncrement: true });
            };
            req.onsuccess = e => { db = e.target.result; res(db); };
            req.onerror   = () => rej(req.error);
        });
    }

    function tx(store, mode = 'readonly') {
        return db.transaction(store, mode).objectStore(store);
    }

    function put(store, data) {
        return new Promise((res, rej) => {
            const r = tx(store, 'readwrite').put(data);
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
    }

    function getAll(store) {
        return new Promise((res, rej) => {
            const r = tx(store).getAll();
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
    }

    async function getProgress(sessionId) {
        return new Promise((res, rej) => {
            const r = tx('progress').get(sessionId);
            r.onsuccess = () => res(r.result || null);
            r.onerror   = () => rej(r.error);
        });
    }

    async function setProgress(sessionId, chapterId, sceneId, turnCount = 0) {
        return put('progress', { session_id: sessionId, chapter_id: chapterId, scene_id: sceneId, turn_count: turnCount });
    }

    async function incrementTurn(sessionId) {
        const p = await getProgress(sessionId);
        if (p) { p.turn_count++; await put('progress', p); return p.turn_count; }
        return 0;
    }

    async function saveUtterance(sessionId, text) {
        const record = { session_id: sessionId, text, ts: Date.now() };
        await put('utterances', record);
        // Добавить в очередь синхронизации Маяка (без текста — только факт)
        await put('sync_queue', { type: 'utterance', session_id: sessionId, ts: record.ts });
    }

    async function saveChoice(sessionId, choiceId) {
        await put('choices', { session_id: sessionId, choice_id: choiceId, ts: Date.now() });
        await put('sync_queue', { type: 'choice', session_id: sessionId, choice_id: choiceId, ts: Date.now() });
    }

    async function addTag(sessionId, tag) {
        await put('tags', { session_id: sessionId, tag, ts: Date.now() });
        await put('sync_queue', { type: 'tag', session_id: sessionId, tag, ts: Date.now() });
    }

    async function getRecentUtterances(sessionId, limit = 5) {
        const all = await getAll('utterances');
        return all.filter(u => u.session_id === sessionId).slice(-limit);
    }

    async function getChoiceHistory(sessionId) {
        const all = await getAll('choices');
        return all.filter(c => c.session_id === sessionId).map(c => c.choice_id);
    }

    async function getSyncQueue() {
        return getAll('sync_queue');
    }

    async function clearSyncQueue() {
        return new Promise((res, rej) => {
            const r = tx('sync_queue', 'readwrite').clear();
            r.onsuccess = () => res();
            r.onerror   = () => rej(r.error);
        });
    }

    return {
        open, getProgress, setProgress, incrementTurn,
        saveUtterance, saveChoice, addTag,
        getRecentUtterances, getChoiceHistory,
        getSyncQueue, clearSyncQueue,
    };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: НОЧНОЙ МАЯК — батчинг раз в сутки, только на WiFi
// ════════════════════════════════════════════════════════════════════
const NightBeacon = (() => {
    const BEACON_URL      = 'http://lighthouse:8001/beacon'; // адрес домашнего сервера
    const LAST_SYNC_KEY   = 'iskra_last_sync';
    const SYNC_INTERVAL   = 24 * 60 * 60 * 1000; // 24 часа

    async function shouldSync() {
        const last = parseInt(localStorage.getItem(LAST_SYNC_KEY) || '0');
        return Date.now() - last > SYNC_INTERVAL;
    }

    async function trySync() {
        if (!(await shouldSync())) return;

        // Не синхронизируем на мобильном трафике (если API доступен)
        if (navigator.connection?.type === 'cellular') {
            console.log('[Маяк] Мобильный трафик — пропускаем');
            return;
        }

        const queue = await Memory.getSyncQueue();
        if (!queue.length) return;

        // Формируем батч — только обезличенные мета-данные (БЕЗ текстов реплик)
        const batch = {
            device_id:  getDeviceId(),        // анонимный хэш, без имени
            session_id: SESSION_ID,
            synced_at:  new Date().toISOString(),
            events: queue.map(e => ({
                type: e.type,
                ts:   e.ts,
                // choice_id и tag — да, текст реплик — НЕТ
                ...(e.choice_id && { choice_id: e.choice_id }),
                ...(e.tag       && { tag: e.tag }),
            })),
        };

        try {
            const res = await fetch(BEACON_URL, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(batch),
                signal:  AbortSignal.timeout(10_000),
            });

            if (res.ok) {
                const update = await res.json();
                await Memory.clearSyncQueue();
                localStorage.setItem(LAST_SYNC_KEY, Date.now().toString());
                console.log('[Маяк] Синхронизация OK');

                // Если студия прислала обновлённый пакет — скачиваем
                if (update.new_package_url) {
                    console.log('[Маяк] Новый пакет:', update.new_package_url);
                    // TODO: скачать и обновить кэш Service Worker
                }
            }
        } catch (e) {
            console.log('[Маяк] Сервер недоступен — попробуем завтра');
        }
    }

    function getDeviceId() {
        let id = localStorage.getItem('iskra_device_id');
        if (!id) {
            // Простой анонимный ID — без привязки к личности
            id = 'dev_' + Math.random().toString(36).slice(2);
            localStorage.setItem('iskra_device_id', id);
        }
        return id;
    }

    return { trySync };
})();

// ════════════════════════════════════════════════════════════════════
//  МОДУЛЬ: DIALOG ENGINE — навигация по сценам + scripted responses
// ════════════════════════════════════════════════════════════════════
const Dialog = (() => {
    const TAG_MAP = {
        смелость:     ['пещер', 'пойти', 'не боюсь', 'вперёд'],
        осторожность: ['подождать', 'остаться', 'страшно', 'не хочу'],
        любопытство:  ['почему', 'что это', 'расскажи', 'интересно'],
        грусть:       ['грустно', 'плохо', 'устал', 'скучно'],
        радость:      ['здорово', 'весело', 'нравится', 'люблю'],
    };

    async function getReply(input, scene) {
        const t = input.toLowerCase();

        // 1. Scripted responses из пакета книги (приоритет)
        for (const sr of (scene.scripted_responses || [])) {
            if (sr.keywords.some(k => t.includes(k))) {
                if (sr.tag) await Memory.addTag(SESSION_ID, sr.tag);
                return sr.response;
            }
        }

        // 2. Дефолтный ответ сцены
        if (scene.default_response) return scene.default_response;

        // 3. Универсальные заглушки (если в пакете нет ничего)
        if (t.includes('страшно') || t.includes('боюсь'))
            return 'Страх — это не враг. Он говорит нам что-то важное. Где именно ты его чувствуешь?';
        if (t.includes('не знаю'))
            return '«Не знаю» — это честный ответ. А если бы знал — что бы сказал?';
        if (t.includes('привет') || t.includes('здравствуй'))
            return `Привет, ${CHILD_NAME}. Я рада, что ты здесь. Что ты сейчас чувствуешь?`;
        return `Я слышу тебя. Продолжай.`;
    }

    // Автоматически выставить теги из реплики ребёнка
    async function autoTag(text) {
        const t = text.toLowerCase();
        for (const [tag, words] of Object.entries(TAG_MAP)) {
            if (words.some(w => t.includes(w))) await Memory.addTag(SESSION_ID, tag);
        }
    }

    return { getReply, autoTag };
})();

// ════════════════════════════════════════════════════════════════════
//  CANVAS + СОСТОЯНИЯ ИСКОРКИ
// ════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const COLORS = {
    idle:      { inner:'rgba(255,255,255,0.9)',  mid:'rgba(0,180,255,0.22)', ray:'rgba(0,100,200,0.12)' },
    listening: { inner:'rgba(255,255,255,1)',    mid:'rgba(0,220,255,0.45)', ray:'rgba(0,160,255,0.32)' },
    thinking:  { inner:'rgba(255,220,100,0.95)', mid:'rgba(255,160,0,0.28)', ray:'rgba(200,100,0,0.18)' },
    speaking:  { inner:'rgba(180,255,220,1)',    mid:'rgba(0,255,180,0.32)', ray:'rgba(0,200,150,0.22)' },
};

const STATUS_LABELS = {
    idle:      'Коснись, чтобы говорить',
    listening: 'Я слышу тебя…',
    thinking:  'Думаю…',
    speaking:  'Говорю…',
};

let iskraState = 'idle';
let audioCtx, analyser, micData;
let idleTick = 0, spinTick = 0;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function drawIskra(vol = 0) {
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const C  = COLORS[iskraState] || COLORS.idle;

    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (iskraState === 'idle')     { idleTick += 0.035; vol = 3 + Math.sin(idleTick) * 2; }
    if (iskraState === 'thinking') { spinTick += 0.055; vol = 6 + Math.sin(spinTick * 2) * 3; }

    const r = 5 + vol * 1.8;

    // Аура
    const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 5);
    aura.addColorStop(0, C.mid);
    aura.addColorStop(0.5, C.mid.replace(/[\d.]+\)$/, '0.04)'));
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(cx, cy, r * 5, 0, Math.PI*2); ctx.fill();

    // Ядро
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
    grd.addColorStop(0, C.inner); grd.addColorStop(0.3, C.mid); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, r * 2.5, 0, Math.PI*2); ctx.fill();

    // Лучи микрофона
    if (micData && (iskraState === 'listening' || iskraState === 'speaking')) {
        analyser.getByteFrequencyData(micData);
        ctx.beginPath();
        for (let i = 0; i < micData.length; i += 4) {
            const a = (i / micData.length) * Math.PI * 2;
            const d = micData[i] * 1.4;
            ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
            ctx.lineTo(cx + Math.cos(a)*(r+d), cy + Math.sin(a)*(r+d));
        }
        ctx.strokeStyle = C.ray; ctx.lineWidth = 1; ctx.stroke();
    }

    // Лучи вращения (thinking)
    if (iskraState === 'thinking') {
        for (let i = 0; i < 12; i++) {
            const a = spinTick + (i/12)*Math.PI*2;
            const d = 28 + Math.sin(spinTick*3+i)*14;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
            ctx.lineTo(cx + Math.cos(a)*(r+d), cy + Math.sin(a)*(r+d));
            ctx.strokeStyle = C.ray; ctx.lineWidth = 0.8; ctx.stroke();
        }
    }
}

function getVol() {
    if (!analyser || !micData) return 0;
    analyser.getByteFrequencyData(micData);
    let s = 0; for (let i=0; i<128; i++) s += micData[i];
    return s / 128;
}

(function loop() { requestAnimationFrame(loop); drawIskra(getVol()); })();

function setState(s) {
    iskraState = s;
    document.getElementById('status').textContent = STATUS_LABELS[s] || '';
}
function showCaption(t) { const el=document.getElementById('caption'); el.textContent=t; el.style.opacity='1'; }
function hideCaption() { document.getElementById('caption').style.opacity='0'; }

// ════════════════════════════════════════════════════════════════════
//  STT  (Web Speech API)
// ════════════════════════════════════════════════════════════════════
let speechRec = null;

function initSTT() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { console.warn('[STT] Нужен Chrome/Edge'); return; }
    speechRec = new SR();
    speechRec.lang = 'ru-RU';
    speechRec.continuous = false;
    speechRec.interimResults = false;

    speechRec.onresult = e => onChildSpoke(e.results[0][0].transcript.trim());
    speechRec.onerror  = e => { if(e.error!=='no-speech') setState('idle'); };
    speechRec.onend    = () => { if(iskraState==='listening') setState('idle'); };
}

function startListening() {
    if (!speechRec || iskraState !== 'idle') return;
    try { speechRec.start(); setState('listening'); } catch(e) {}
}

// ════════════════════════════════════════════════════════════════════
//  TTS  (SpeechSynthesis — Ларс Вокс)
// ════════════════════════════════════════════════════════════════════
let synthVoice = null;

function initTTS() {
    const load = () => {
        const voices = speechSynthesis.getVoices();
        synthVoice = voices.find(v => v.lang === 'ru-RU') || null;
    };
    speechSynthesis.onvoiceschanged = load;
    load();
}

function speak(text, onDone) {
    if (!text) { onDone?.(); return; }
    setState('speaking'); showCaption(text);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; u.rate = 0.88; u.pitch = 1.05;
    if (synthVoice) u.voice = synthVoice;
    u.onend = u.onerror = () => { hideCaption(); setState('idle'); onDone?.(); };
    speechSynthesis.speak(u);
}

// ════════════════════════════════════════════════════════════════════
//  ОСНОВНАЯ ЛОГИКА — навигация по сценам офлайн
// ════════════════════════════════════════════════════════════════════
let currentScene   = null;
let currentChapterId = null;

async function loadCurrentScene() {
    let progress = await Memory.getProgress(SESSION_ID);
    if (!progress) {
        const start = BookEngine.getStarting();
        await Memory.setProgress(SESSION_ID, start.chapterId, start.sceneId, 0);
        progress = { chapter_id: start.chapterId, scene_id: start.sceneId, turn_count: 0 };
    }
    currentChapterId = progress.chapter_id;
    currentScene     = await BookEngine.getScene(progress.chapter_id, progress.scene_id);
    return currentScene;
}

async function playScene(scene) {
    currentScene = scene;
    // Озвучить текст сцены (если есть)
    if (scene.text) {
        speak(scene.text, () => {
            if (scene.after_speech === 'ask_choice') showChoiceHint(scene);
            else setState('idle');
        });
    } else {
        setState('idle');
    }
}

function showChoiceHint(scene) {
    const labels = (scene.choices || []).map(c => c.label).join(' · ');
    showCaption(labels);
}

async function onChildSpoke(text) {
    if (!text) return;
    setState('thinking');
    await Memory.saveUtterance(SESSION_ID, text);
    await Dialog.autoTag(text);

    const scene = currentScene;
    if (!scene) { speak(`Расскажи мне, ${CHILD_NAME}.`); return; }

    // Режим ask_choice: ищем совпадение с выбором по тексту
    if (scene.after_speech === 'ask_choice') {
        const choice = matchChoice(text, scene.choices || []);
        if (choice) {
            await Memory.saveChoice(SESSION_ID, choice.id);
            for (const trigger of (choice.triggers || [])) {
                if (trigger.startsWith('memory:')) await Memory.addTag(SESSION_ID, trigger.slice(7));
            }
            const found = await BookEngine.findScene(choice.next_scene);
            if (found) {
                await Memory.setProgress(SESSION_ID, found.chapterId, choice.next_scene, 0);
                speak(`Хорошо.`, () => playScene(found.scene));
            }
            return;
        }
        // Не поняли выбор — переспросить
        speak(`Скажи ещё раз: ${(scene.choices||[]).map(c=>c.label).join(' или ')}?`);
        return;
    }

    // Режим free_talk: ответ из scripted_responses пакета
    const reply = await Dialog.getReply(text, scene);
    const turns = await Memory.incrementTurn(SESSION_ID);

    // Проверяем лимит ходов
    if (scene.max_turns && turns >= scene.max_turns && scene.on_end) {
        speak(reply, async () => {
            const found = await BookEngine.findScene(scene.on_end);
            if (found) {
                await Memory.setProgress(SESSION_ID, found.chapterId, scene.on_end, 0);
                await playScene(found.scene);
            }
        });
    } else {
        speak(reply);
    }
}

// Нечёткое сопоставление выбора с голосовым вводом
function matchChoice(text, choices) {
    const t = text.toLowerCase();
    // Точное совпадение ключевых слов из label
    for (const c of choices) {
        const words = c.label.toLowerCase().split(/\s+/);
        if (words.some(w => w.length > 3 && t.includes(w))) return c;
    }
    // По id выбора
    for (const c of choices) {
        if (t.includes(c.id.toLowerCase())) return c;
    }
    return null;
}

// ════════════════════════════════════════════════════════════════════
//  ЗАПУСК
// ════════════════════════════════════════════════════════════════════
async function start() {
    document.getElementById('start-screen').style.display = 'none';
    setState('thinking');

    // Инициализация микрофона
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        micData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e) { console.error('[Mic]', e); }

    initSTT();
    initTTS();

    // Инициализация памяти
    await Memory.open();

    // Загрузка книги
    try {
        await BookEngine.init();
        const scene = await loadCurrentScene();
        speak(`Привет, ${CHILD_NAME}. Добро пожаловать в Грондхейм.`, () => playScene(scene));
    } catch(e) {
        console.warn('[BookEngine]', e);
        speak(`Привет, ${CHILD_NAME}. Я здесь.`, () => setState('idle'));
    }

    // Ночной Маяк — попробуем синхронизировать в фоне
    setTimeout(() => NightBeacon.trySync(), 5000);
}

// ════════════════════════════════════════════════════════════════════
//  ОБРАБОТЧИКИ ВВОДА
// ════════════════════════════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click', start);

canvas.addEventListener('click',      () => { if(iskraState==='idle') startListening(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if(iskraState==='idle') startListening(); }, { passive:false });

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('[SW] Зарегистрирован'))
        .catch(e => console.warn('[SW]', e));
}
